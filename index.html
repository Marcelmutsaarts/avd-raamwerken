  <svg class="hair" id="hair" aria-hidden="true"></svg>
  <footer class="uv-f"><span class="uv-docs"><a href="${DOCS.wp}" target="_blank" rel="noopener">Whitepaper</a><a href="${DOCS.ag}" target="_blank" rel="noopener">Achtergronddocument</a></span><button type="button" id="lvBig" class="${big?'on':''}" aria-pressed="${big}" title="Grotere tekst voor de beamer">A+</button></footer>
  <div class="lensf" id="lensf" aria-hidden="true"><span id="lensT"></span></div>
  <div class="sr-only" id="lvlive" aria-live="polite"></div></section>`;}

/* ---------- knipkaart ---------- */
function knip(label,text,key,opt){opt=opt||{};const id=kid(key);
  return `<div class="knip" data-kid="${id}"><div class="kn-h"><span><span class="sc">✂</span>${esc(label)}</span><span class="kn-a"><button type="button" data-copyk="${id}">Kopieer</button></span></div><div class="kn-b ${opt.long?'long':''}" ${opt.hidden?'hidden':''}>${esc(text)}</div>${opt.extra?`<p class="kn-x">${esc(opt.extra)}</p>`:''}<span class="stamp">Gekopieerd</span></div>`;}
const KT={};
function kid(key){return 'k'+Math.abs([...key].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7));}
// opt.copy: de tekst die gekopieerd wordt, als die langer is dan wat de kaart toont
function card(label,text,key,opt){KT[kid(key)]=opt&&opt.copy||text;return knip(label,text,key,opt);}
function closeKnip(focus){const p=$('#kpanel');if(!p)return;p.classList.remove('on');$('#kmap').setAttribute('aria-expanded','false');
  if(focus){const b=$('#kmap');(b&&!b.hidden?b:$('#lf-h')).focus({preventScroll:true});}}
function knipUI(){const n=LV.knip.length,b=$('#kmap');if(!b)return;const was=b.hidden;b.hidden=!n;$('#kcount').textContent=n;$('#uv').classList.toggle('hk',!!n);if(was!==b.hidden)requestAnimationFrame(hair);
  const pnl=$('#kpanel');if(!pnl.classList.contains('on'))return;
  if(!n){const had=pnl.contains(document.activeElement);closeKnip(had);return;}
  pnl.innerHTML=`<div class="kp-h"><div><b>Knipmap</b><small>${n} ${n===1?'knipsel':'knipsels'} · samen te kopiëren als één werkwijze</small></div><button type="button" class="lnk" data-kclose aria-label="Knipmap sluiten" style="font-size:18px;color:var(--mu)">✕</button></div>
   <div class="kp-b">${LV.knip.map((k,i)=>`<div class="kp-i"><div><b>${esc(k.label)}</b><p>${esc(k.text)}</p></div><button type="button" data-kdel="${i}" aria-label="Verwijder ${esc(k.label)}">×</button></div>`).join('')}</div>
   <div class="kp-f"><button type="button" class="btn pri sm" data-kall>Kopieer alles</button><button type="button" class="btn line sm" data-kempty>Leeg</button></div>`;}
function saveKnip(){store.set('avd-knip',JSON.stringify(LV.knip));knipUI();
  $$('#stage [data-addk]').forEach(b=>{b.textContent=LV.knip.some(k=>k.id===b.dataset.addk)?'In knipmap ✓':'+ Knipmap';});}

/* ---------- bouwstenen van de bladen ---------- */
// het bewijs in gewone woorden, zonder codering
function evLine(x){return `<p class="evw">Onderzoek naar de aanpak: <b>${esc(x.a)}</b>. Onderzoek met AI: <b>${esc(x.m)}</b>.</p>`;}
function seal(n,cls){return `<span class="hseal ${cls||''}">${n}</span>`;}
function sideNav(prev,next){const L=(x,k)=>x?`<a href="${x[0]}" data-k="nav-${k}" rel="${k==='p'?'prev':'next'}">${esc(x[1])}</a>`:'<span class="dis" aria-hidden="true"></span>';
  return `<nav class="sidenav" aria-label="Bladeren">${L(prev,'p')}${L(next,'n')}</nav>`;}
// de knipkaart toont de bouwsteen zonder de voorbeeldzinnen (die staan er al boven), maar kopieert ze wel mee
function opCard(o,ls){const full=snippet(o,ls),vis=full.replace(/\n\nZO WEL:[\s\S]*$/,'');
  return card(ls?'Tekst voor de opdracht':'Bouwsteen voor je prompt',vis,'op-'+o+'-'+(ls?1:0),{ctx:OPS[o].n,copy:full});}
// link naar de prompthulp; een ontwerpprincipe met een variantnotitie gaat er niet als losse bouwsteen in
function phLink(R,s,o,variant){const sel=s.p!=null?[{p:R.lp[s.p]}]:subLps(R,s.sub),noted=!!variant||sel.some(x=>x.p.op.includes(o)&&x.p.note&&x.p.note[o]),used=sel.some(x=>x.p.op.includes(o)),withOp=used&&!noted;
  return `<p class="ph-l"><a class="lk" href="#/lv/prompthulp?rol=${R.id}${s.p!=null?'&lp='+s.p:(R.subs?'&sub='+s.sub:'')}${withOp?'&op='+o:''}">Zet in de prompthulp →</a></p>`;}
// één ontwerpprincipe: hoe je het uitvoert. Met R en s.p als onderdeel van een principe, anders als losse plaat.
function opBlock(o,R,s){const O=OPS[o],gi=O.g,S=STAPPEN[o],p=R&&s.p!=null?R.lp[s.p]:null,ls=R?!!R.lerendeStuurt:!O.pb,variant=p&&p.note&&p.note[o]?p.note[o]:null;
  const steps=S?`<p class="sl"><span>${esc(S.label)}</span></p><ol class="st3 ${o==='hd'?'stairs':''}">${S.s.map((x,i)=>`<li style="--i:${i}"><i>${i+1}</i><div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div></li>`).join('')}</ol>${S.note?`<p class="src2">${esc(S.note)}</p>`:''}`:'';
  const quotes=O.zw?`<div class="qts"><div class="qt no"><i>✕</i><span>“${esc(O.zn)}”</span></div><div class="qt"><i>✓</i><span>“${esc(O.zw)}”</span></div></div>`:'';
  // binnen een rol staat de naam al op het tabblad; alleen bij één ontwerpprincipe zetten we hem erboven
  const head=R?(p&&p.op.length===1?`<h2 class="op-n">${esc(O.n)}</h2>`:''):`<h1 class="pn-h1" id="lf-h" tabindex="-1">${esc(O.n)}</h1>`;
  return `${head}<p class="lsub">${esc(O.functie)}</p>
  ${variant?`<div class="nota"><b>Bij dit principe: ${esc(variant.replace(/^(Hier|Variant):\s*/i,''))}</b></div><details class="ref"><summary>Het algemene ontwerpprincipe</summary>${steps}${quotes}</details>`
   :`${steps}${quotes}${opCard(o,ls)}`}
  ${!R?`<p class="sl"><span>Gebruikt door</span></p><div class="seals">${OPR[o].map(r=>`<a href="${lvHash({rol:r.id,o})}" data-k="sh-${r.id}"><i>${rIdx(r)}</i>${esc(plain(r.n))}</a>`).join('')}</div>`:''}
  ${R?phLink(R,s,o,variant):''}
  <details class="ref"><summary>Wanneer en waar je op let</summary>
   <h5>Wanneer</h5><p>${esc(O.wanneer)}</p><h5>Zo zie je of het werkt</h5><p>${esc(O.beoordeel)}</p>
   <h5>Let op</h5><ul>${O.fouten.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></details>`;}
function plinth(active,big){return `<ul class="plinth ${big?'big':''}" aria-label="Fundament: vijf uitgangspunten">${UP.map((u,i)=>`<li><a class="pb ${active===i+1?'on':''}" href="#/lv/fundament/${i+1}" data-k="pb-${i+1}" style="--d:${i}" ${active===i+1?'aria-current="page"':''}><span>${esc(u.n)}</span></a></li>`).join('')}</ul>`;}

function figOver(){return {top:`<h1 class="uv-h1" id="lf-h" tabindex="-1">Elke chatbot heeft al een <em>didactiek</em>.</h1>

function figRol(R,s){const i=rIdx(R),S=R.subs?R.subs[s.sub]:null,L=!!R.lerendeStuurt,lps=subLps(R,s.sub);
  const k=ROLES.indexOf(R),pv=ROLES[(k+6)%7],nx=ROLES[(k+1)%7];

    <div class="pn-id">${seal(i,'xl')}<h1 class="pn-h1" id="lf-h" tabindex="-1">${esc(plain(R.n))}</h1></div>
    ${R.subs?`<div class="seg" role="group" aria-label="Kies de variant">${R.subs.map((x,j)=>`<a href="${lvHash({rol:R.id,sub:j})}" class="${s.sub===j?'on':''}" ${s.sub===j?'aria-current="true"':''} data-k="sub-${j}">${esc(x.n)}</a>`).join('')}</div>`:''}
    <p class="lsub">${esc(S?SUBTXT[s.sub]:R.functie)}</p>
    <dl class="rfacts"><div><dt>Kies bij</dt><dd>${esc(R.leerdoel)}</dd></div><div><dt>Zichtbaar leren</dt><dd>${esc(S?S.zie:R.zie)}</dd></div><div class="no"><dt>Zonder ontwerp</dt><dd>${esc(R.standaard)}</dd></div></dl>
    ${card(L?'Opdracht voor lerenden':'Rolprompt',rolePrompt(R,s.sub||0),'rp-'+R.id+'-'+(s.sub||0),{long:true,hidden:!LV.rpv,ctx:rName(R,s.sub)})}
    <p class="src2"><button type="button" class="lnk" data-rpv>${LV.rpv?'Verberg tekst':'Toon tekst'}</button> · <a class="lk sm" href="#/lv/prompthulp?rol=${R.id}${R.subs?'&sub='+s.sub:''}">Pas aan in de prompthulp</a></p>
  </div>
  <div class="pn-r">
    <p class="sl"><span>Principes en werkwijzen</span></p>
    <ol class="plist">${lps.map(({p,l})=>`<li><a href="${lvHash({rol:R.id,p:l})}" data-k="p-${l}" data-zoom="${esc(p.n)}"><span><b>${esc(p.n)}</b><em>${esc(p.ai)}</em></span><span class="ar" aria-hidden="true">→</span></a></li>`).join('')}</ol>
    <details class="ref"><summary>Waarom deze rol</summary><p>${esc(R.onderzoek)}</p>${(R.aandacht||[]).map(a=>`<p><b>${esc(a[0])}.</b> ${esc(a[1])}</p>`).join('')}</details>
  </div></div>
  ${sideNav([lvHash({rol:pv.id}),'‹ '+plain(pv.n)],[lvHash({rol:nx.id}),plain(nx.n)+' ›'])}</article>`};}
function figPr(R,s){const p=R.lp[s.p],j=lpPos(R,s),L=!!R.lerendeStuurt,lps=subLps(R,p.sub),o=curOp(s);
  const prev=j>0?[lvHash({rol:R.id,p:lps[j-1].l}),'‹ '+lps[j-1].p.n]:null,next=j<lps.length-1?[lvHash({rol:R.id,p:lps[j+1].l}),lps[j+1].p.n+' ›']:null;

    <div class="exec-b" id="execb">${opBlock(o,R,s)}</div>
  </div></div>
  ${sideNav(prev,next)}</article>`};}
function figLib(){return {body:`<article class="panel pv-lib" id="panel"><div class="pn-top"><h1 class="pn-h1" id="lf-h" tabindex="-1">Vijftien ontwerpprincipes</h1>
  <p class="lsub">Bouwstenen om een aanpak zorgvuldig uit te voeren. De rollen delen ze.</p></div>
  <div class="reg">${GROUPS.map((g,gi)=>`<section style="--gc:${CLTXT(gi)}"><h2>${esc(G[gi])}</h2>${g.map(o=>`<a class="rg" href="#/lv/op/${o}" data-po="${o}" data-k="l-${o}"><b>${esc(OPS[o].n)}</b><em>${esc(OPS[o].functie)}</em></a>`).join('')}</section>`).join('')}</div></article>`};}
function figOpd(o){const i=OPORD.indexOf(o),pv=OPORD[i-1],nx=OPORD[i+1];

function figFund(s){if(!s.fund)return {body:`<article class="panel pv-fund" id="panel"><div class="pn-top"><h1 class="pn-h1" id="lf-h" tabindex="-1">Het fundament</h1>

  <ol class="idx fl">${UP.map((u,i)=>`<li><a href="#/lv/fundament/${i+1}" data-k="pb-${i+1}"><span><b>${esc(u.n)}</b><em>${esc(u.f)}</em></span><span class="ar" aria-hidden="true">→</span></a></li>`).join('')}</ol></article>`};

   <li><i>2</i><span><b>Vijf uitgangspunten over leren vormen het fundament:</b> voorkennis, denkwerk, passende hulp, oefening en het verschil tussen presteren en leren.</span></li>
   <li><i>3</i><span><b>Zeven didactische rollen zijn de ingang:</b> tutor, leerling en Socratische gesprekspartner, procesbegeleider, simulator, mentor, coach en hulpmiddel. Elke rol heeft eigen principes en werkwijzen.</span></li>
   <li><i>4</i><span><b>Vijftien ontwerpprincipes</b> beschrijven hoe je een aanpak zorgvuldig uitvoert. Ze worden gedeeld door meerdere rollen. Het zijn bouwstenen: stapel ze niet automatisch.</span></li>
   <li><i>5</i><span><b>Ontwerp vanuit de lerende.</b> Elk principe verbindt wat AI doet met wat de lerende doet en waaraan je ziet dat er geleerd wordt.</span></li></ol>
  <h2>Elke chatbot heeft al een didactiek</h2>
  <p>Wie een chatbot een vraag stelt, krijgt de didactiek van de standaardinstellingen: snel, vloeiend, volledig en meegaand. Dat voelt behulpzaam, maar leren vraagt iets anders. In een veldexperiment met bijna duizend scholieren scoorden leerlingen die vrij met GPT-4 hadden geoefend daarna lager op een toets zonder AI dan leerlingen zonder AI. Een versie die hints gaf in plaats van antwoorden, voorkwam dat nadeel (Bastani e.a., 2025). Studenten die AI de opgaven lieten maken, begrepen de stof minder diep dan studenten die om uitleg vroegen (Lehmann e.a., preprint 2025). En wie met AI werkt, overschat vaak de eigen prestatie (Fernandes e.a., 2026).</p>
  <p><b>De les daaruit:</b> het ontwerp van de toepassing en de manier van gebruik bepalen mede of AI het leren versterkt of ondermijnt. Docenten kunnen daar regie op nemen. Daarvoor is dit raamwerk.</p>
  <h2>Wat Mollick al gaf, en wat wij toevoegen</h2>
  <p>De zeven rollen komen uit <i>Assigning AI</i> van Ethan en Lilach Mollick (2023), dat al didactische aanwijzingen per rol bevat. Onze bijdrage is het systematiseren, verdiepen en verbinden: vaste uitgangspunten onder alle rollen, onderbouwing per principe, een gedeelde verzameling ontwerpprincipes, en de koppeling met onze andere raamwerken en de Nederlandse en Vlaamse onderwijspraktijk.</p>
  <h2>Instellingen, geen wetten</h2>
  <p>Regels als "één vraag per beurt" of "geef niet meteen het antwoord" zijn standaardinstellingen. Je stemt ze af op doel, taak en lerende. Een beginner die vastloopt, heeft bijvoorbeeld meer aan een uitgewerkt voorbeeld dan aan nog een vraag. Eén ding geldt wel altijd: AI blijft eerlijk over wat niet klopt, ook als de lerende aandringt.</p>
  <p>Een rol kan werken in een chatbot, een gebouwde app, een opdracht, een simulatie of samen met docent en medeleerlingen. Een prompt vraagt gedrag; een gebouwde toepassing kan het afdwingen, bijvoorbeeld door een hint pas te tonen na een eigen poging.</p>
  <h2>Voorbeeld: de faalangstcoach</h2>
  <div class="cardx"><p><b>Leerdoel:</b> de lerende herkent wat er gebeurt bij spanning rond een toets en kiest een eigen, haalbare aanpak.</p><p><b>Activiteit van de lerende:</b> een concrete situatie beschrijven, gedachten, gevoel en gedrag onderscheiden, een kleine stap kiezen en later evalueren.</p><p><b>Inrichting:</b> de coachprincipes met de ontwerpprincipes Zelfregulatie en Reflectie. Geen diagnose of behandeling; verwijzen bij ernstige klachten. Vakinhoudelijke hulp alleen als die bij de hulpvraag past.</p><p><b>Zichtbaar leren:</b> een plan in eigen woorden, uitgevoerd in de echte situatie, met een eigen evaluatie daarna.</p><p><a class="lnk" href="#/lv/coach">Bekijk de rol Coach →</a></p></div>
  <h2>Wat we wel en niet claimen</h2>
  <p>De sterkste basis is de algemene leerwetenschap. Onderzoek naar leren met generatieve AI is nog jong: korte interventies, kleine groepen, gemeten op directe uitkomsten. Een goed onderbouwd leerprincipe maakt een chatbotinstructie dus niet automatisch effectief. Test in je eigen context. Het achtergronddocument laat per principe zien hoe stevig het onderzoek is.</p>
  <h2>Aan de slag in vier stappen</h2><ol class="five">
   <li><i>1</i><span><b>Begin bij het leerdoel.</b> Wat moet de lerende straks kunnen, en wat moet de lerende daarvoor zelf doen?</span></li>
   <li><i>2</i><span><b>Kies de rol.</b> Eén rol per leeractiviteit; combineer rollen alleen als ze elkaar opvolgen.</span></li>
   <li><i>3</i><span><b>Vertaal naar een ontwerp.</b> Neem de rolprincipes op in de werkwijze van je prompt (doel, context en voorwaarden, bronnen, voorbeelden, werkwijze), of als ontwerpeisen in BOUW. <a class="lnk" href="#/lv/prompthulp">Naar de prompthulp →</a></span></li>
   <li><i>4</i><span><b>Test als een lerende.</b> Vraag om het antwoord, geef een fout antwoord, dring aan. En kijk na afloop wat er zonder hulp is blijven hangen.</span></li></ol>
  <h2>Andere weergaven</h2>
  <p>Hetzelfde raamwerk bestaat ook als <a class="lnk" href="kolommen.html#/lv">kolommen</a> en als <a class="lnk" href="ruimte.html#/lv">3D-maquette</a>. De samenhang met AI-geletterdheid, KIES en BOUW staat op de <a class="lnk" href="#/">startpagina</a>.</p>
