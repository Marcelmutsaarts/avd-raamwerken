/* ---------- over het raamwerk ---------- */
function lvOver(){const a=EVC.a,m=EVC.m,n=EVC.n;
  view.innerHTML=`<article class="over">
  <p class="eyebrow">Conceptversie 2</p><h1>Over het raamwerk</h1>
  <p class="lead">Het Raamwerk Leerverrijking helpt docenten AI een didactische rol te geven die het leren dient, onderbouwd met leerwetenschap.</p>
  <div class="dl"><a class="dlc" href="${DOCS.wp}" target="_blank" rel="noopener"><span class="ic">PDF</span><span><b>Whitepaper</b><span>Verkorte versie, 7 pagina's</span></span></a><a class="dlc" href="${DOCS.ag}" target="_blank" rel="noopener"><span class="ic">PDF</span><span><b>Achtergronddocument</b><span>Alle principes, onderbouwing en bronnen</span></span></a></div>
  <h2>In vijf punten</h2><ol class="five">
   <li><i>1</i><span><b>Elke chatbot heeft al een didactiek.</b> Zonder ontwerp geeft AI snel en volledig antwoord en kan het precies het denkwerk overnemen dat de lerende moest doen.</span></li>
   <li><i>2</i><span><b>Vijf uitgangspunten over leren vormen het fundament:</b> voorkennis, denkwerk, passende hulp, oefening en het verschil tussen presteren en leren.</span></li>
   <li><i>3</i><span><b>Zeven didactische rollen zijn de ingang:</b> tutor, leerling en Socratische gesprekspartner, procesbegeleider, simulator, mentor, coach en hulpmiddel. Elke rol heeft eigen principes en werkwijzen.</span></li>
   <li><i>4</i><span><b>Vijftien ontwerpprincipes</b> beschrijven hoe je een aanpak zorgvuldig uitvoert. Ze worden gedeeld door meerdere rollen. Het zijn bouwstenen: stapel ze niet automatisch.</span></li>
   <li><i>5</i><span><b>Ontwerp vanuit de lerende.</b> Elk principe verbindt wat AI doet met wat de lerende doet en waaraan je ziet dat er geleerd wordt.</span></li></ol>
  <h2>Elke chatbot heeft al een didactiek</h2>
  <p>Wie een chatbot een vraag stelt, krijgt de didactiek van de standaardinstellingen: snel, vloeiend, volledig en meegaand. Dat voelt behulpzaam, maar leren vraagt iets anders. In een veldexperiment met bijna duizend scholieren scoorden leerlingen die vrij met GPT-4 hadden geoefend daarna lager op een toets zonder AI dan leerlingen zonder AI. Een versie die hints gaf in plaats van antwoorden, voorkwam dat nadeel (Bastani e.a., 2025). Studenten die AI de opgaven lieten maken, begrepen de stof minder diep dan studenten die om uitleg vroegen (Lehmann e.a., preprint 2025). En wie met AI werkt, overschat vaak de eigen prestatie (Fernandes e.a., 2026).</p>
  <p><b>De les daaruit:</b> het ontwerp van de toepassing en de manier van gebruik bepalen mede of AI het leren versterkt of ondermijnt. Docenten kunnen daar regie op nemen. Daarvoor is dit raamwerk.</p>
  <h2>Wat Mollick al gaf, en wat wij toevoegen</h2>
  <p>De zeven rollen komen uit <i>Assigning AI</i> van Ethan en Lilach Mollick (2023), dat al didactische aanwijzingen per rol bevat. Onze bijdrage is het systematiseren, verdiepen en verbinden: vaste uitgangspunten onder alle rollen, onderbouwing per principe, een gedeelde verzameling ontwerpprincipes, en de koppeling met onze andere raamwerken en de Nederlandse en Vlaamse onderwijspraktijk.</p>
  <h2>Instellingen, geen wetten</h2>
  <p>Regels als "één vraag per beurt" of "geef niet meteen het antwoord" zijn standaardinstellingen. Je stemt ze af op doel, taak en lerende. Een beginner die vastloopt, heeft bijvoorbeeld meer aan een uitgewerkt voorbeeld dan aan nog een vraag. Eén ding geldt wel altijd: AI blijft eerlijk over wat niet klopt, ook als de lerende aandringt.</p>
  <p>Een rol kan werken in een chatbot, een gebouwde app, een opdracht, een simulatie of samen met docent en medeleerlingen. Een prompt vraagt gedrag; een gebouwde toepassing kan het afdwingen, bijvoorbeeld door een hint pas te tonen na een eigen poging.</p>
  <h2>Voorbeeld: de faalangstcoach</h2>
  <div class="cardx"><p><b>Leerdoel:</b> de lerende herkent wat er gebeurt bij spanning rond een toets en kiest een eigen, haalbare aanpak.</p><p><b>Activiteit van de lerende:</b> een concrete situatie beschrijven, gedachten, gevoel en gedrag onderscheiden, een kleine stap kiezen en later evalueren.</p><p><b>Inrichting:</b> de coachprincipes met de ontwerpprincipes Zelfregulatie en Reflectie. Geen diagnose of behandeling; verwijzen bij ernstige klachten. Vakinhoudelijke hulp alleen als die bij de hulpvraag past.</p><p><b>Zichtbaar leren:</b> een plan in eigen woorden, uitgevoerd in de echte situatie, met een eigen evaluatie daarna.</p><p><a class="lnk" href="#/lv/coach">Bekijk de rol Coach →</a></p></div>
  <h2>Wat we wel en niet claimen</h2>
  <p>De sterkste basis is de algemene leerwetenschap. Onderzoek naar leren met generatieve AI is nog jong: korte interventies, kleine groepen, gemeten op directe uitkomsten. Een goed onderbouwd leerprincipe maakt een chatbotinstructie dus niet automatisch effectief. Test in je eigen context. Het achtergronddocument laat per principe zien hoe stevig het onderzoek is.</p>
  <h2>Aan de slag in vier stappen</h2><ol class="five">
   <li><i>1</i><span><b>Begin bij het leerdoel.</b> Wat moet de lerende straks kunnen, en wat moet de lerende daarvoor zelf doen?</span></li>
   <li><i>2</i><span><b>Kies de rol.</b> Eén rol per leeractiviteit; combineer rollen alleen als ze elkaar opvolgen.</span></li>
   <li><i>3</i><span><b>Vertaal naar een ontwerp.</b> Neem de rolprincipes op in de werkwijze van je prompt (doel, context en voorwaarden, bronnen, voorbeelden, werkwijze), of als ontwerpeisen in BOUW. <a class="lnk" href="#/lv/prompthulp">Naar de prompthulp →</a></span></li>
   <li><i>4</i><span><b>Test als een lerende.</b> Vraag om het antwoord, geef een fout antwoord, dring aan. En kijk na afloop wat er zonder hulp is blijven hangen.</span></li></ol>
  <h2>Andere weergaven</h2>
  <p>Hetzelfde raamwerk bestaat ook als <a class="lnk" href="kolommen.html#/lv">kolommen</a> en als <a class="lnk" href="ruimte.html#/lv">3D-maquette</a>. De samenhang met AI-geletterdheid, KIES en BOUW staat op de <a class="lnk" href="#/">startpagina</a>.</p>
  <h2>Bronnen (selectie)</h2><ul class="refs">
   <li>Bastani, H., e.a. (2025). Generative AI without guardrails can harm learning: Evidence from high school mathematics. <i>PNAS, 122</i>(26).</li>
   <li>Belland, B. R., e.a. (2017). Synthesizing results from empirical research on computer-based scaffolding in STEM education. <i>Review of Educational Research, 87</i>(2).</li>
   <li>Chi, M. T. H., &amp; Wylie, R. (2014). The ICAP framework. <i>Educational Psychologist, 49</i>(4).</li>
   <li>Fernandes, D., e.a. (2026). AI makes you smarter but none the wiser. <i>Computers in Human Behavior</i>.</li>
   <li>Kestin, G., e.a. (2025). AI tutoring outperforms in-class active learning. <i>Scientific Reports, 15</i>, 17458.</li>
   <li>Mollick, E., &amp; Mollick, L. (2023). Assigning AI: Seven approaches for students, with prompts. SSRN.</li>
   <li>Simonsmeier, B. A., e.a. (2022). Domain-specific prior knowledge and learning: A meta-analysis. <i>Educational Psychologist, 57</i>(1).</li>
   <li>Soderstrom, N. C., &amp; Bjork, R. A. (2015). Learning versus performance. <i>Perspectives on Psychological Science, 10</i>(2).</li>
   <li>Wisniewski, B., Zierer, K., &amp; Hattie, J. (2020). The power of feedback revisited. <i>Frontiers in Psychology, 10</i>, 3087.</li></ul>
  <p style="font-size:14px;color:var(--muted)">De volledige bronnenlijst staat in het achtergronddocument.</p></article>`;}

   [[['Ethische vragen herkennen','Je herkent ethische vraagstukken rond AI: privacy, bias, transparantie en verantwoordelijkheid.'],['Geschikte data','Je beschrijft welke data je wel en niet in AI-tools kunt invoeren.'],['Bewust afwegen','Je weegt bewust af wanneer het wenselijk is om AI in te zetten.'],['Transparant naar leerlingen','Je vertelt leerlingen open wanneer je AI in de les gebruikt.'],['Wet- en regelgeving','Je kent de basis van de wet- en regelgeving die ertoe doet, zoals de AVG en de AI Act.']],
    ['Benoemt concrete privacyrisico’s bij AI-gebruik in de klas','Kan uitleggen wat bias is en een voorbeeld geven uit de eigen context','Communiceert transparant met leerlingen over AI-gebruik','Kent de hoofdlijnen van de AVG en de AI Act voor het onderwijs','Neemt verantwoordelijkheid voor door AI gemaakte output']],
   [[['Tools ethisch evalueren','Je evalueert AI-tools systematisch op ethische gronden, ook op bias.'],['Richtlijnen en protocollen','Je helpt mee aan ethische richtlijnen en protocollen voor AI-gebruik in de organisatie.'],['Collega’s begeleiden','Je begeleidt collega’s bij ethisch verantwoorde keuzes rond AI.'],['Casuïstiek maken','Je maakt van ethische vraagstukken casussen voor teamgesprekken of voor je onderwijs.'],['Ethisch kader op school','Je gebruikt een ethisch kader als de school AI-tools kiest en invoert.']],
    ['Evalueert AI-tools systematisch op ethische criteria','Ontwikkelt of draagt bij aan ethische richtlijnen voor de school','Betrekt ethiek actief in pedagogische en didactische keuzes over AI','Begeleidt collega’s bij ethische vraagstukken rond AI','Onderbouwt de keuze voor een tool met ethische argumenten']]).concat([
   {id:'kernthemas',n:'Kernthema’s',f:'Vier vragen die bij elke AI-beslissing meelopen.',items:[['Privacy en databescherming','Welke data voer je in bij een AI-tool, en mogen leerlinggegevens erin? De AVG en de Europese AI Act stellen eisen aan het gebruik van persoonsgegevens.'],['Bias en eerlijkheid','AI-systemen zijn getraind op data uit de samenleving, inclusief de vooroordelen daarin. Je herkent dat en weegt het mee.'],['Transparantie en verantwoording','Zet je AI in, dan moeten leerlingen dat weten. In sommige situaties is dat ook wettelijk verplicht.'],['Verantwoordelijkheid voor de output','Je bent en blijft verantwoordelijk voor wat er in de klas gebeurt, ook als je AI-materiaal gebruikt.']],
    knip:[['Vuistregels privacy','Persoonsgegevens vragen een grondslag.\nAnonimiseren is de minimale stap.\nEen gratis account is iets anders dan een EDU-omgeving met verwerkersovereenkomst.']]}])},
 {L:'C',n:'AI-kennis en vaardigheden',q:'AI begrijpen, aansturen en beoordelen',
  t:'Wie AI inzet, moet begrijpen hoe het werkt. Niet zoals een ingenieur, maar als professionele gebruiker. Je weet wat een taalmodel is, waarom AI hallucineert en hoe trainingsdata de output beïnvloeden. En je weet hoe je AI goed aanstuurt.',
  knip:['Kennisvragen om te checken','Wat is machine learning?\nWat zijn trainingsdata?\nWaarom hallucineert een taalmodel?\nWat is het verschil tussen generatieve, regelgebaseerde en discriminatieve AI?\nWelke AI-tools zijn er, waarvoor zijn ze geschikt, en welke zijn toegestaan op school?'],
  delen:niv('AI-kennis en vaardigheden',
   [[['Werking uitleggen','Je legt op hoofdlijnen uit hoe generatieve AI werkt: trainingsdata, taalmodellen en hallucinaties.'],['Effectief prompten','Je geeft context, beschrijft een rol en verfijnt je instructies.'],['Output beoordelen','Je beoordeelt AI-output kritisch: klopt het, zit er bias in en is het bruikbaar?'],['Twee tools inzetten','Je kent minstens twee AI-tools en gebruikt ze voor onderwijstaken.'],['Tools voor leerlingen','Je weet welke tools je met leerlingen kunt gebruiken, en onder welke voorwaarden.']],
    ['Kan uitleggen wat een taalmodel is, zonder vakjargon','Past prompting toe en verfijnt op basis van de output','Herkent hallucinaties en weet hoe daarmee om te gaan','Gebruikt AI-tools bewust en doelgericht in het eigen werk','Evalueert output systematisch op kwaliteit en bias']],
   [[['Systemen vergelijken','Je vergelijkt AI-systemen op architectuur, kwaliteit en geschiktheid voor een specifieke toepassing.'],['Geavanceerd prompten','Je gebruikt geavanceerde prompttechnieken, zoals few-shot learning, chain-of-thought en systeeminstructies.'],['Nieuwe tools evalueren','Je beoordeelt zelf een nieuwe AI-tool op kwaliteit, betrouwbaarheid en geschiktheid.'],['Training begrijpen','Je begrijpt hoe AI-modellen worden getraind en wat dat betekent voor de output.'],['Anderen begeleiden','Je helpt anderen in je organisatie om AI-vaardigheden op te bouwen.']],
    ['Vergelijkt AI-systemen op inhoudelijke gronden','Past geavanceerde prompttechnieken toe en kan ze uitleggen','Evalueert nieuwe tools zelfstandig op meerdere criteria','Heeft inzicht in de beperkingen van specifieke AI-modellen','Begeleidt collega’s bij het ontwikkelen van AI-vaardigheden']]).concat([
   {id:'kerngebieden',n:'Kerngebieden',f:'Kennis, vaardigheden, kritisch oordeel en zicht op de tools.',items:[['Conceptuele kennis','Je begrijpt op hoofdlijnen hoe generatieve AI werkt, bijvoorbeeld wat trainingsdata zijn en waarom een taalmodel hallucineert.'],['Praktische vaardigheden','Je prompt effectief en beoordeelt output kritisch. Je vergelijkt tools en kiest de juiste voor een taak.'],['Kritische evaluatie','Je ziet wanneer iets klopt, wanneer het plausibel klinkt maar fout is, en wanneer het bias weerspiegelt.'],['Het tool-landschap','Je weet welke AI-tools er voor onderwijs zijn, waarvoor ze geschikt zijn en welke op jouw school zijn toegestaan.']],
    knip:[['Promptopbouw','Context: ...\nRol: ...\nGewenst format: ...\nDaarna: verfijn op basis van de output.']]}])},
 {L:'D',n:'AI-pedagogiek en didactiek',q:'Leren versterken, denken niet omzeilen',
  t:'AI-geletterdheid gaat niet alleen over jezelf, maar ook over je leerlingen. Je bepaalt wanneer AI het leren versterkt en wanneer het denken wordt omzeild. Je ontwerpt leeractiviteiten waarin AI het leren verrijkt en niet vervangt, en je kiest een positie over toetsing.',
  knip:['Ontwerpvragen bij een AI-activiteit','Wanneer voegt AI iets toe aan het leerproces?\nWelk doel heeft de activiteit?\nWat doet de leerling zelf, en wat doet de AI?\nHoe beoordeel je het leerproces als AI erbij betrokken is?\nWat is een authentieke toets in een wereld waarin AI teksten kan schrijven?'],
  rel:['Uitgewerkt in het Raamwerk Leerverrijking','#/lv'],
  delen:niv('AI-pedagogiek en didactiek',
   [[['Doelgericht integreren','Je gebruikt AI in je lessen op een pedagogisch en didactisch verantwoorde manier, met een helder doel.'],['Ondersteunen of omzeilen','Je ziet het verschil tussen AI-gebruik dat het leren ondersteunt en AI-gebruik dat het leren omzeilt.'],['Leerlingen begeleiden','Je helpt leerlingen om AI bewust en kritisch te gebruiken.'],['Eenvoudig ontwerpen','Je ontwerpt eenvoudige leeractiviteiten met AI en let daarbij op het leerproces.'],['Reflecteren op toetsing','Je denkt na over wat AI betekent voor je eigen manier van toetsen.']],
    ['Integreert AI doelgericht in minstens één lesactiviteit','Kan uitleggen waarom een bepaalde AI-inzet het leren ondersteunt','Begeleidt leerlingen bij reflectie op AI-gebruik','Heeft een doordachte positie over AI en toetsing','Ontwerpt activiteiten waarbij het denkproces zichtbaar blijft']],
   [[['Hogere-orde denken','Je ontwerpt vernieuwende leeractiviteiten met AI die hogere-orde denken stimuleren.'],['Visie op toetsing','Je formuleert een visie op toetsing die rekening houdt met AI, en je voert die uit.'],['Collega’s begeleiden','Je begeleidt collega’s als zij AI pedagogisch en didactisch in hun onderwijs inbouwen.'],['AI-geletterde leerlingen','Je ontwerpt leeractiviteiten waarin leerlingen zelf AI-geletterdheid ontwikkelen.'],['Schoolbrede afspraken','Je helpt mee aan schoolbrede afspraken over AI in toetsing en onderwijs.']],
    ['Ontwerpt complexe leeractiviteiten met AI die transfer bevorderen','Heeft een uitgewerkte visie op toetsing in een AI-rijke omgeving','Begeleidt collega’s bij AI-pedagogiek en -didactiek op basis van eigen ervaring','Draagt bij aan schoolbreed beleid over AI in onderwijs en toetsing','Documenteert en deelt pedagogische en didactische ervaringen met AI']]).concat([
   {id:'kernvragen',n:'Kernvragen',f:'Vier vragen die dit domein onderscheiden van een gewone AI-cursus.',vorm:'vragen',items:[['Wanneer voegt AI iets toe?','AI kan het leren verrijken, maar ook het denken vervangen. Je beoordeelt wanneer AI het leren ondersteunt en wanneer het het leren omzeilt.'],['Hoe begeleid je bewust gebruik?','Je gaat het gesprek aan, maakt fouten bespreekbaar en stimuleert verwondering én kritisch denken.'],['Hoe ontwerp je met AI?','Welk doel heeft de activiteit, wat doet de leerling zelf en wat doet de AI?'],['Hoe ga je om met toetsing?','AI verandert de spelregels van toetsing fundamenteel. Je kiest een positie over wat een authentieke toets nog is.']]}])},
 {L:'E',n:'Digital agency',q:'Regie houden over AI',
  t:'Digital agency (Saab, 2025) is het vermogen om technologie kritisch te begrijpen, bewust te beoordelen en doelgericht in te zetten. Het gaat om regie: je doet actief mee en laat je niet passief meesturen. Dit domein brengt de andere vier samen.',
  knip:['Kritische vragen bij een AI-systeem','Hoe werkt dit AI-systeem?\nWie ontwikkelt het?\nWelke belangen spelen daarin?\nWie profiteert ervan?\nWat zijn de maatschappelijke gevolgen?'],
  delen:niv('Digital agency',
   [[['Zelf beslissen','Je beslist zelf en bewust wanneer en hoe je AI inzet.'],['Keuzes onderbouwen','Je onderbouwt je keuzes over AI met professionele argumenten.'],['Kritisch reflecteren','Je denkt kritisch na over de rol die AI speelt in je eigen werk.'],['Niet klakkeloos volgen','Je volgt de aanbevelingen van tools of platforms niet zomaar op.'],['Actief meepraten','Je doet actief mee aan gesprekken over AI in je school of team.']],
    ['Onderbouwt AI-keuzes met professionele argumenten','Handelt niet automatisch vanuit externe druk of modetrends','Reflecteert regelmatig op de eigen positie ten opzichte van AI','Neemt actief deel aan teamgesprekken over AI','Erkent verantwoordelijkheid voor keuzes rond AI']],
   [[['Voortrekkersrol','Je neemt in je organisatie het voortouw als het gaat om AI-bewustzijn.'],['Collega’s coachen','Je coacht collega’s zodat ze zelf leren handelen rond AI.'],['Collectief leren','Je helpt de AI-geletterdheid van je team groeien, door kennis te delen of door professionalisering.'],['Kritisch naar aanbieders','Je neemt een kritische positie in tegenover commerciële AI-aanbieders in het onderwijs.'],['Professionele identiteit','Je ziet AI-geletterdheid als deel van je professionele identiteit, en dat laat je actief zien.']],
    ['Neemt een zichtbare voortrekkersrol in AI-bewustzijn in de organisatie','Coacht collega’s bij het ontwikkelen van eigen handelingsvermogen','Draagt bij aan collectieve professionalisering buiten de eigen klas','Heeft een kritische, onderbouwde positie ten opzichte van AI-aanbieders','Beschouwt AI-geletterdheid als professionele kernwaarde']]).concat([
   {id:'dimensies',n:'Vijf dimensies',f:'Waaruit regie over AI bestaat.',items:[['Autonomie','Je maakt eigen, afgewogen keuzes over AI, gebaseerd op je professionele waarden, je kennis en je pedagogisch-didactisch inzicht.'],['Kritisch bewustzijn','Je begrijpt hoe AI-systemen werken, wie ze maakt en welke belangen er spelen. Je ziet ook de gevolgen voor de samenleving.'],['Verantwoordelijkheidsbesef','Je erkent dat keuzes over AI gevolgen hebben voor leerlingen, collega’s en de organisatie.'],['Constructieve nieuwsgierigheid','Je verkent technologie met verwondering en een kritische, open blik. Je wilt haar echt begrijpen en beheersen.'],['Participatie en voortrekkerschap','Op gevorderd niveau gaat het verder dan jezelf: je helpt de organisatie bewust richting te geven aan AI.']]}])}]},
kies:{id:'kies',n:'KIES',full:'KIES, AI-vaardigheid van leerlingen en studenten',lw:'De vier letters',
 h1:'Gebruik je AI, of gebruikt AI <em>jou</em>?',
 lead:'KIES helpt leerlingen en studenten bewust kiezen wanneer en hoe ze AI inzetten, zonder hun eigen denken uit handen te geven. Eerst kiezen, dan instrueren, dan evalueren. Daaromheen gelden de spelregels.',
 sokkel:{lb:'Bij elke keuze drie vragen',to:'k/vragen',items:['Leer ik minder, hetzelfde of meer?','Gaat het sneller?','Wordt het resultaat beter?']},
 docs:[['KIES op aivoordocenten.nl','https://aivoordocenten.nl/kies/'],['Raamwerk','https://aivoordocenten.nl/downloads/kies/raamwerk-kies-2026.pdf'],['KIES-app','https://ai-vaardigheid.vercel.app/']],
 letters:[
 {L:'K',n:'Kiezen',q:'Wanneer gebruik je AI?',
  t:'Kiezen is het hart van KIES. Per opdracht en per subtaak bepaal je opnieuw: zet ik AI in, en zo ja, in welke rol? Dat is een actieve beslissing, geen gewoonte. Weten wanneer, in welke rol en waarom is belangrijker dan kunnen prompten.',
  knip:['De K-vraag bij een nieuwe opdracht','Wat is hier de slimste aanpak: zelf, samen met AI, of AI doet het?'],
  team:'Stelling K1: Wij stellen onze leerlingen actief de vraag wanneer ze AI wel of niet inzetten.\n- Hoe verwerken we deze vraag in onze opdrachten?\n- Welke argumenten geven we leerlingen mee om te kiezen?\n- Hoe voorkomen we dat de keuze voor AI altijd voor de hand ligt?\n- Welke voorbeeldrol nemen wij hierin?\n\nStelling K2: Wij maken voor elke opdracht expliciet wat AI wel en niet mag doen.\n- Welke rollen onderscheiden we voor AI in een opdracht?\n- Hoe leggen we dit vast voor leerlingen?\n- Hoe consistent is dit binnen ons team en tussen vakken?\n- Wat communiceren we hierover naar ouders?'+SC0,
  delen:[
  {id:'keuzes',n:'Drie keuzes',f:'Per subtaak doe je het zelf, werk je samen met AI of besteed je een deel uit. Bij de laatste twee krijgt AI een rol.',vorm:'fork',
   items:[['Zelf doen','Je doet deze stap zonder AI. Dat kan verstandig zijn bij de subtaak waar het leerdoel zit.'],['Samen met AI','Je blijft zelf aan het stuur en het denkwerk blijft van jou. AI voegt iets toe aan je denken, maar vervangt het niet.'],['Een deel uitbesteden','AI levert een product, zoals een tekst, vertaling of samenvatting. Jij stuurt aan, beoordeelt het en maakt het eigen.']],
   rollen:[[['Uitlegger','Legt iets uit in jouw tempo en op jouw niveau. Jij vraagt door.'],['Brainstormer','Stelt vragen en bedenkt samen met jou ideeën. Jij kiest wat je oppakt.'],['Oefenmaatje','Toetst je kennis, of je oefent ertegen, zoals een sollicitatiegesprek.'],['Feedbackgever','Geeft tips op een tekst die jij hebt gemaakt. Jij beslist wat je ermee doet.']],
    [['Samenvatter','Vat een bron of tekst samen. Jij werkt ermee verder.'],['Schrijver','Schrijft een stuk tekst op basis van wat jij aanlevert. Jij kiest wat blijft.'],['Vertaler','Vertaalt een tekst. Jij controleert en past aan.'],['Verbeteraar','Maakt jouw tekst beter qua stijl of spelling. Jij beslist wat je overneemt.']]],
   cap:'De acht rollen zijn een startset, geen volledige lijst.',rel:['De docentkant van deze rollen: Raamwerk Leerverrijking','#/lv']},
  {id:'vragen',n:'Drie vragen',f:'Wat doet deze keuze met je leren, je tempo en je resultaat? Zit het leerdoel in de subtaak, dan weegt leren het zwaarst.',vorm:'vragen',
   items:[['Leer ik minder, hetzelfde of meer?','Dan wanneer ik het zelf had gedaan.'],['Gaat het sneller?','Sneller is een legitiem doel, zeker bij een voorbereidende subtaak.'],['Wordt het resultaat beter?','Ook beter is een legitiem doel. De kunst is het verschil met leren te herkennen.']],
   kaart:['De drie vragen','1. Leer ik door deze manier van AI-inzet minder, hetzelfde of meer dan wanneer ik het zelf had gedaan?\n2. Gaat het langzamer, even snel of sneller?\n3. Wordt het resultaat slechter, even goed of beter?'],
   knip:[['Terugblik op je keuze','Wat ging bij jou omhoog en wat omlaag: leren, kwaliteit of snelheid?\nStel dat je deze opdracht voor school echt moet inleveren. Zou je dan dezelfde keuzes maken? Wat zou je veranderen?\nWat wil je bij je volgende opdracht anders doen?']]},
  {id:'per-subtaak',n:'Zo kies je, per subtaak',f:'Een opdracht bestaat uit stappen, zoals bronnen verzamelen, argumenten opbouwen, formuleren en reviseren. Per stap maak je de afweging opnieuw.',vorm:'flow',
   items:[['AI of zelf?','Kies je voor zelf, dan stopt het hier en geldt de gewone aanpak.'],['Samen of uitbesteden?','Dat verschil bepaalt wat je ervan leert.'],['Welke rol?','Welke rol krijgt AI in deze subtaak?']],
   kaart:['Kiezen per subtaak','Zet ik hier AI in, of doe ik dit zelf?\nZo ja: werk ik samen met AI, of besteed ik een deel uit?\nWelke rol krijgt de AI in deze subtaak?'],
   knip:[['Als een leerling vastloopt','Wat wil je hier eigenlijk leren?\nWat hoop je dat dit werk over jou laat zien?\nWelke stap vind jij zelf het belangrijkst om goed te doen?\nHoe zou je dit aanpakken zonder AI? En wat verandert er als je AI inschakelt?']]}]},
 {L:'I',n:'Instrueren',q:'Hoe vraag je het goed?',
  t:'Zodra je een rol hebt gekozen, moet je die goed aansturen. Een brainstormer vraag je iets anders dan een samenvatter. Je geeft een heldere opdracht en relevante context, en je stuurt bij tot AI bruikbare hulp geeft. Instrueren is niet het hart van KIES, wel een voorwaarde om je keuze tot iets te laten leiden.',
  knip:['Promptskelet','Rol: Doe alsof je een ... bent.\nContext: Ik ...\nInstructies: ...\nVoorbeeld: Het zou ongeveer zo moeten klinken: ...'],
  team:'Stelling I1: Onze leerlingen krijgen expliciet instructie over het aansturen van AI.\n- Welke instructie geven wij hierover, en wie geeft die?\n- Hoe sluit dit aan bij vaknormen en leerdoelen?\n- Wat is het verschil tussen oppervlakkig en doordacht aansturen?\n- Hoe oefenen we dit in de praktijk?\n\nStelling I2: Onze leerlingen begrijpen dat hun manier van aansturen de uitkomst bepaalt.\n- Hoe maken we dit verband zichtbaar in de les?\n- Welke voorbeelden gebruiken we?\n- Hoe voorkomen we dat leerlingen alleen kopiëren?\n- Wanneer is een prompt goed genoeg?'+SC0,
  delen:[
  {id:'vier-delen',n:'Vier delen van een prompt',f:'Veel leerlingen slaan het voorbeeld over, terwijl dat vaak het verschil maakt.',
   items:[['Rol','Tegen wie praat AI? Bijvoorbeeld: ‘Doe alsof je een docent Nederlands bent.’'],['Context','Wat moet AI weten over de situatie? Bijvoorbeeld: ‘Ik schrijf een brief voor een stage.’'],['Instructies','Wat moet AI precies doen? Bijvoorbeeld: ‘Maak deze brief korter en formeler.’'],['Voorbeeld','Hoe ziet een goed antwoord eruit?']]},
  {id:'per-rol',n:'Per rol anders',f:'Wat je meegeeft, hangt af van de rol die je bij Kiezen koos.',
   items:[['Uitlegger','Geef je eigen niveau mee en wat je al weet.'],['Brainstormer','Geef het probleem en nodig AI uit tot breed en vrij denken.'],['Feedbackgever','Geef je tekst en het criterium waarop je feedback wilt. Een feedbackgever werkt alleen als je precies uitlegt waarop.'],['Schrijver','Geef doel, doelgroep, toon en lengte mee.']]},
  {id:'bijsturen',n:'Bijsturen',f:'De eerste output is een begin. Bijsturen is vaak belangrijker dan de eerste prompt.',
   items:[['Opnieuw proberen','Kijk naar de eerste output en stuur bij: opnieuw prompten, aanvullen of de rol verfijnen.'],['Kort als kan, lang als nodig','Een goede prompt is niet zo lang mogelijk. De inhoud bepaalt het resultaat, niet de lengte.'],['Geen garantie','Ook een scherpe prompt levert nooit een gegarandeerd kloppend antwoord. Daarom blijf je evalueren.']]}]},
 {L:'E',n:'Evalueren',q:'Klopt wat AI zegt?',
  t:'Wat uit AI komt is grondstof, geen eindproduct. Je controleert het op juistheid, kwaliteit en bruikbaarheid en verwerkt het bewust in je eigen werk. Ook als je een deel uitbesteedt, blijf je eigenaar en moet je weten wat er staat.',
  knip:['Checklist AI-output','Klopt wat er staat?\nIs het compleet?\nIs het relevant voor deze opdracht?\nPast het bij mijn eigen stem?\nBegrijp ik wat er staat?'],
  team:'Stelling E1: Onze leerlingen kunnen AI-output kritisch beoordelen op juistheid, relevantie en bias.\n- Welke beoordelingscriteria geven we mee?\n- Hoe oefenen we dit in concrete situaties?\n- Welke fouten leren leerlingen herkennen?\n- Hoe voorkomen we klakkeloos overnemen?\n\nStelling E2: Onze leerlingen nemen eigenaarschap over wat ze met AI maken.\n- Wat betekent eigenaarschap als AI heeft meegeschreven?\n- Hoe maken we dat zichtbaar bij beoordeling?\n- Welke vraag stellen we leerlingen na een AI-opdracht?\n- Hoe voorkomen we dat eigenaarschap een formaliteit wordt?'+SC0,
  delen:[
  {id:'mens-ai-mens',n:'Mens, AI, mens',f:'Jij begint, AI produceert, jij maakt het eigen.',vorm:'flow',
   items:[['Mens geeft input','Jij geeft de opdracht, de prompt en de context.'],['AI produceert','AI voorspelt waarschijnlijke woorden en weet niet zelf of het klopt.'],['Mens maakt het eigen','Jij toetst, corrigeert en herschrijft tot het eigen werk is. Zonder deze stap wordt AI-gebruik wegklikken in plaats van leren.']]},
  {id:'eigenaarschap',n:'Kennis, oordeel, eigenaarschap',f:'Wat je nodig hebt om AI-uitvoer echt te kunnen beoordelen.',
   items:[['Kennis','Je weet hoe taalmodellen werken en waarom ze de fout ingaan.'],['Oordeel','Klopt wat er staat, is het compleet, is het relevant voor deze opdracht, en past het bij je eigen stem?'],['Eigenaarschap','Je blijft verantwoordelijk voor wat er staat, ook als AI meeschreef. Je kunt uitleggen waarom dit het juiste antwoord is.']],
   knip:[['De check-vraag','Klopt dit?\nHoe weet je dat?']]},
  {id:'valkuilen',n:'Drie valkuilen',f:'Vooroordelen, verzinsels en ja-knikken.',
   items:[['Vooroordelen','AI leerde patronen van mensen, en menselijke vooroordelen sluipen daarin mee. Zo beschrijft AI een dokter vaak automatisch als ‘hij’.'],['Verzinsels','AI verzint soms feiten, namen, citaten of bronnen, en brengt die even zelfverzekerd als wat wel klopt.'],['Ja-knikken','AI geeft je snel gelijk, ook als je het mis hebt. Dat voelt prettig, maar is gevaarlijk voor kritisch denken.']],
   knip:[['Valkuilen opsporen','Voor wie is dit antwoord eigenlijk geschreven?\nHoe zou je dit in het echt checken?']]}]},
 {L:'S',n:'Spelregels',q:'Wat mag en moet?',
  t:'Je werkt volgens de afspraken van je school en weegt privacy, bias, energieverbruik en verantwoord gebruik mee. De schoolregels zijn het zichtbare topje. Het grotere deel is zelf vragen stellen die niet in een schoolregel staan.',
  knip:['Schoolbeleid concreet maken','Bij ons mag AI wel voor ..., niet voor ..., en je moet het melden bij ...'],

const FWR={geletterdheid:'geletterd',kies:'kies',bouw:'bouw'},FWP={geletterd:'geletterdheid',kies:'kies',bouw:'bouw'};
const FA={cur:null};
const lc=L=>L.L.toLowerCase();

/* ---------- toestand en links ---------- */
function faParse(F,parts){const s={fw:F.id,l:null,d:null},a=(parts[1]||'').toLowerCase(),b=parts[2];
  if(a){const L=faL(F,a);if(!L)s.bad=true;else{s.l=a;if(b!=null){if(L.delen.some(x=>x.id===b))s.d=b;else s.bad=true;}}}
  if(parts.length>3)s.bad=true;return s;}
function faHash(s){const r='#/'+FWP[s.fw];return s.l?r+'/'+s.l+(s.d?'/'+s.d:''):r;}
const faView=s=>s.d?'deel':s.l?'let':'over',faLvl=s=>s.d?2:s.l?1:0;

function faLetFig(F,s){const L=faL(F,s.l),k=F.letters.indexOf(L),n=F.letters.length,pv=F.letters[(k+n-1)%n],nx=F.letters[(k+1)%n],key=F.id+'-'+s.l;

function faDeelFig(F,s){const L=faL(F,s.l),j=L.delen.findIndex(x=>x.id===s.d),d=L.delen[j],key=F.id+'-'+s.l+'-'+d.id,H=x=>faHash({fw:F.id,l:s.l,d:x.id});

  const canon=faHash(s);if(s.bad)toast('Deze plek bestaat niet (meer).');if(location.hash!==canon)history.replaceState(null,'',canon);
  faApply(F,s,FA.cur,fresh);}
