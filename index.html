<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AVD-raamwerken · AI voor Docenten</title>
<meta name="description" content="De onderwijskundige raamwerken van AI voor Docenten in één omgeving: AI-geletterdheid, KIES, BOUW en Leerverrijking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080F17;--ink2:#121a26;--ink3:#1c2533;--text:#3d3f46;--muted:#6B6F74;--line:#e7e3ef;--line2:#d6cfe4;
  --purple:#5F3792;--violet:#A25DF8;--lav:#ECDFFE;--lav2:#f6f1fe;--bg:#fbfaff;--white:#fff;
  --c-geletterd:#7C5CFF;--c-kies:#E0559B;--c-bouw:#25A47E;--c-lv:#A25DF8;
  --g0:#A25DF8;--g1:#F0A23B;--g2:#22A699;--g3:#E0559B;
  --ok:#22a06b;--warn:#e08a1e;--bad:#e5484d;
  --r:20px;--font:Poppins,'Segoe UI',system-ui,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{color:var(--ink);margin:0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left))}
.eyebrow{font:600 12px/1.3 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.dark .eyebrow{color:#c9a6ff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(8,15,23,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:30px;height:30px}
.mark i{border-radius:4px}
.brand b{font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:#a9a3b8;font-weight:500;letter-spacing:.04em;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:#d9d4e6;text-decoration:none;font-size:14px;font-weight:500;padding:8px 13px;border-radius:10px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(162,93,248,.18);color:#fff}
.crumb{font-size:13px;color:#a9a3b8;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.crumb a{text-decoration:none;color:#cbb7f5}
.crumb a:hover{color:#fff}
.light .crumb{color:var(--muted)}.light .crumb a{color:var(--purple)}

/* heroes */
.dark{background:var(--ink);color:#c9c5d3;position:relative;overflow:hidden}
.dark h1,.dark h2,.dark h3{color:#fff}
.glow::before{content:"";position:absolute;inset:-30% -10% auto auto;width:900px;height:900px;background:radial-gradient(closest-side,rgba(162,93,248,.35),transparent 70%);pointer-events:none}
.glow::after{content:"";position:absolute;left:-200px;bottom:-400px;width:800px;height:800px;background:radial-gradient(closest-side,rgba(95,55,146,.45),transparent 70%);pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 30%,#000 30%,transparent 75%);pointer-events:none}
.hero{padding:70px 0 80px;position:relative}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.06;font-weight:800;margin:14px 0 18px;max-width:16ch}
.hero .lead{font-size:clamp(17px,1.6vw,19px);max-width:56ch;color:#d4cfe0}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid transparent;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--violet);color:#fff;box-shadow:0 10px 30px rgba(162,93,248,.35)}
.btn.pri:hover{background:#8d45ef}
.btn.ghost{border-color:rgba(255,255,255,.25);color:#fff;background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.line{border-color:var(--line2);color:var(--ink);background:#fff}
.btn.line:hover{border-color:var(--violet);color:var(--purple)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
section.blk{padding:84px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;margin-bottom:34px}
.sh h2{font-size:clamp(26px,3vw,38px);line-height:1.12;margin-top:8px;max-width:22ch}
.sh p{max-width:52ch;color:var(--muted)}
.light{background:var(--lav2)}

/* hub */
.fw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:-60px;position:relative;z-index:2}
.fw{background:#fff;border-radius:24px;padding:24px 22px 22px;text-decoration:none;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(8,15,23,.12);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.fw:hover{transform:translateY(-4px);box-shadow:0 30px 70px rgba(8,15,23,.18)}
.fw::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
.fw .as{font:600 11.5px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.fw h3{font-size:24px}
.fw p{font-size:14.5px;line-height:1.55}
.fw .keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.fw .keys span{font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);border-radius:8px;padding:4px 8px}
.fw .go{font-weight:600;font-size:14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.fw .tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--lav);color:var(--purple);margin-bottom:-2px}
.fw.feat{background:linear-gradient(160deg,#fff 60%,var(--lav2))}
.fw.feat .tag{background:var(--violet);color:#fff}
.rel{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.rel svg{width:100%;height:auto}
.rel-list{display:grid;gap:12px}
.rel-item{display:grid;grid-template-columns:12px 1fr;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.rel-item i{width:12px;height:12px;border-radius:4px;margin-top:6px}
.rel-item b{color:var(--ink);font-weight:600;display:block;font-size:15px}
.rel-item span{font-size:14px;color:var(--muted)}

/* wiel */
.lv-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,620px);gap:30px;align-items:center}
.wheelbox{position:relative}
#wheel{width:100%;height:auto;display:block;overflow:visible}
#wheel .lnk{fill:none;stroke-width:1.6;opacity:.14;transition:opacity .25s,stroke-width .25s}
#wheel .lnk.on{opacity:.95;stroke-width:2.4}
#wheel .lnk.off{opacity:.03}
#wheel .rn{cursor:pointer}
#wheel .rn circle.bg{transition:all .25s}
#wheel .rn:hover circle.bg,#wheel .rn.on circle.bg{filter:drop-shadow(0 0 14px var(--rc))}
#wheel .rn.dim{opacity:.28}
#wheel .opd{cursor:pointer;transition:opacity .25s}
#wheel .opd circle{transition:r .2s}
#wheel .opd.on circle{r:12}
#wheel .opd.dim{opacity:.22}
#wheel .fseg{cursor:pointer;transition:opacity .2s}
#wheel .fseg:hover{opacity:1!important}
#wheel text{font-family:var(--font);pointer-events:none}
.w-in .wl{opacity:0}
.wl{transition:opacity .8s ease}
.wheel-info{margin-top:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 18px;min-height:112px}
.wheel-info .k{font:600 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:#c9a6ff}
.wheel-info b{display:block;color:#fff;font-size:18px;margin:4px 0 2px}
.wheel-info p{font-size:14px;color:#c3bdd0;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:#a9a3b8}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}

/* bouwlagen / uitgangspunten */
.layers{display:grid;gap:12px}
.layer{display:grid;grid-template-columns:150px 1fr auto;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.layer .n{font:800 34px/1 var(--font);color:var(--violet)}
.layer .n small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.layer b{color:var(--ink);font-size:17px}
.layer p{font-size:14.5px;color:var(--muted)}
.up-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.up{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:border-color .2s,transform .2s}
.up:hover{border-color:var(--violet);transform:translateY(-2px)}
.up .num{font:800 14px/1 var(--font);color:#fff;background:var(--purple);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.up h3{font-size:17px;line-height:1.3}
.up p{font-size:14px;line-height:1.5}
.ev{display:flex;flex-direction:column;gap:5px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line2)}
.evr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.evr .bars{display:flex;gap:3px}
.evr .bars i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.evr .bars i.f{background:var(--purple)}
.evr .bars.ai i.f{background:var(--g2)}
.evr em{font-style:normal;font-weight:600;color:var(--ink)}

/* rollen grid */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.role{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.role:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(95,55,146,.14);border-color:var(--rc)}
.role .ri{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--rc) 13%,#fff);color:var(--rc)}
.role .ri svg{width:34px;height:34px;--ic-bg:color-mix(in srgb,var(--rc) 13%,#fff)}
.role h3{font-size:19px}
.role .k{font-size:14px;color:var(--muted)}
.role .meta{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--rc)}
.role.wide{background:linear-gradient(135deg,var(--ink),#2a1550);color:#d4cfe0;border:0}
.role.wide h3{color:#fff}
svg .t,svg .b{fill:var(--ic-bg,#fff)}

/* keten */
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:10px}
.ch{background:#fff;border:1px solid var(--line);padding:22px 20px;position:relative}
.ch:first-child{border-radius:20px 0 0 20px}.ch:last-child{border-radius:0 20px 20px 0}
.ch+.ch{border-left:0}
.ch .s{font:800 13px/1 var(--font);color:#fff;background:var(--violet);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:12px}
.ch b{color:var(--ink);font-size:16.5px;display:block}
.ch p{font-size:14px;color:var(--muted);margin-top:4px}
.ch:not(:last-child)::after{content:"";position:absolute;right:-11px;top:34px;width:20px;height:20px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg);z-index:1}
.loop{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px;color:var(--muted);font-size:14px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.s4{background:var(--ink);color:#c9c5d3;border-radius:20px;padding:22px}
.s4 .n{font:800 40px/1 var(--font);background:linear-gradient(135deg,#c9a6ff,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.s4 b{color:#fff;display:block;margin:8px 0 4px;font-size:16.5px}
.s4 p{font-size:14px}

/* claims */
.claims{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.claim{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.claim h3{font-size:17px;margin-bottom:6px}
.claim p{font-size:14px;color:var(--muted)}
.scale{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.scale div{display:flex;gap:10px;font-size:13.5px;align-items:flex-start}
.scale div b{min-width:132px;color:var(--ink);font-weight:600;white-space:nowrap}

/* rolpagina */
.rp-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.rp-icon{width:120px;height:120px;border-radius:34px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--rc);box-shadow:0 0 60px color-mix(in srgb,var(--rc) 40%,transparent)}
.rp-icon svg{width:74px;height:74px;--ic-bg:#0f1622}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.fact{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px}
.fact span{font:600 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:#c9a6ff}
.fact p{color:#e8e4f0;font-size:14.5px;margin-top:5px;line-height:1.5}
.versus{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.phone{border-radius:26px;padding:18px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px rgba(8,15,23,.08)}
.phone.no{background:#fff7f7;border-color:#f6d6d6}
.phone.yes{background:#f7fff9;border-color:#cfeedd}
.phone .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phone .ph i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff}
.phone.no .ph i{background:var(--bad)}.phone.yes .ph i{background:var(--ok)}
.phone .ph b{color:var(--ink);display:block;font-size:15.5px}
.phone .ph span{font-size:12.5px;color:var(--muted)}
.bub{border-radius:18px 18px 18px 4px;padding:13px 16px;font-size:15px;line-height:1.55;color:var(--ink);background:#fff;border:1px solid var(--line);position:relative;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phone .note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--text);text-decoration:none}
.chip:hover{border-color:var(--violet);color:var(--purple)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lps{display:grid;gap:14px}
.lp{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:grid;grid-template-columns:44px 1fr 210px;gap:18px 22px}
.lp .no{font:800 15px/1 var(--font);color:#fff;background:var(--rc,var(--purple));width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.lp h3{font-size:19px;line-height:1.3}
.lp .type{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:8px;vertical-align:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.duo>div{background:var(--lav2);border-radius:14px;padding:12px 14px}
.duo span,.lab{font:600 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}
.duo p{font-size:14.5px;color:var(--ink);margin-top:4px;line-height:1.5}
.lp .side{display:flex;flex-direction:column;gap:10px}
.lp .src{font-size:12px;color:var(--muted);line-height:1.45}
.lp .opl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.opchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;text-decoration:none;background:#fff;border:1.5px solid var(--line2);border-radius:10px;padding:6px 10px;color:var(--ink)}
.opchip i{width:9px;height:9px;border-radius:50%}
.opchip:hover{border-color:var(--violet)}
.subh{font:700 13px/1.3 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin:18px 0 2px}
.prose p+p{margin-top:12px}
.prose b{color:var(--ink)}
.aside{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.two{display:grid;grid-template-columns:1.3fr .7fr;gap:24px}
.rnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px}

/* bibliotheek */
.clusters{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}
.cl h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--ink)}
.cl h3 i{width:12px;height:12px;border-radius:4px}
.opc{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;margin-bottom:12px;transition:transform .2s,border-color .2s;border-left:4px solid var(--gc)}
.opc:hover{transform:translateY(-2px);border-color:var(--gc)}
.opc b{color:var(--ink);font-size:16px;display:block}
.opc p{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.opc .m{display:flex;gap:10px;margin-top:10px;font-size:12px;font-weight:600;color:var(--gc)}
.opc.dim{opacity:.35}
.stepper{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;position:relative;margin-top:8px}
.st{position:relative;padding:0 10px 0 0}
.st .d{width:42px;height:42px;border-radius:13px;background:var(--gc);color:#fff;font:800 16px/1 var(--font);display:grid;place-items:center;position:relative;z-index:1}
.st:not(:last-child)::before{content:"";position:absolute;left:42px;right:0;top:20px;height:2px;background:color-mix(in srgb,var(--gc) 35%,#fff)}
.st b{display:block;color:var(--ink);font-size:15px;margin-top:12px;line-height:1.35}
.st span{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.stepper.stairs .st{transform:translateY(calc(var(--i)*-10px))}
.stairs-wrap{padding-top:50px}
.evid{display:grid;gap:12px}
.evb{border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.6}
.evb .lab{display:block;margin-bottom:4px}
.evb.o{background:#fff;border:1px solid var(--line)}
.evb.g{background:#fff8ec;border:1px solid #f5dfb8}.evb.g .lab{color:#a8650c}
.evb.v{background:var(--lav2);border:1px dashed var(--line2)}
.fails{margin:0;padding-left:18px}
.fails li{margin:4px 0}
.fails li::marker{color:var(--bad)}
.copybox{background:var(--ink);border-radius:18px;padding:16px;color:#e8e4f0}
.copybox pre{margin:0 0 12px;white-space:pre-wrap;font:13px/1.6 var(--mono);color:#e8e4f0;max-height:340px;overflow:auto}

/* prompthulp */
.ph-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:26px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;margin-bottom:16px}
.card h3{font-size:18px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.card h3 .s{font:800 13px/1 var(--font);color:#fff;background:var(--violet);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.card .hint{font-size:13.5px;color:var(--muted);margin-bottom:12px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line2);border-radius:13px;padding:11px 13px;font:15px/1.5 var(--font);color:var(--ink);background:#fff;outline:0;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(162,93,248,.12)}
.rolepick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rpk{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.25}
.rpk svg{width:28px;height:28px;color:var(--rc);--ic-bg:#fff}
.rpk:hover{border-color:var(--rc)}
.rpk.on{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,#fff)}
.rpk.on svg{--ic-bg:color-mix(in srgb,var(--rc) 10%,#fff)}
.lpcheck{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lpcheck:first-of-type{border-top:0}
.lpcheck input{width:20px;height:20px;accent-color:var(--violet);margin-top:2px}
.lpcheck b{color:var(--ink);font-size:15px;font-weight:600}
.lpcheck span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.lpcheck .evr{margin-top:4px}
.sticky{position:sticky;top:84px}
.out{background:var(--ink);border-radius:24px;padding:18px;color:#e8e4f0;box-shadow:0 30px 60px rgba(8,15,23,.25)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:#a9a3b8;border-radius:9px;padding:8px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--violet);color:#fff}
.out pre{margin:0;white-space:pre-wrap;font:12.8px/1.62 var(--mono);color:#ece8f4;max-height:52vh;overflow:auto;background:rgba(255,255,255,.03);border-radius:14px;padding:14px}
.out pre .hl{color:#c9a6ff;font-weight:700}
.out pre .ph{background:rgba(240,162,59,.18);color:#ffd08a;border-radius:4px}
.out .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.out .btn.ghost{border-color:rgba(255,255,255,.2)}
.status{font-size:13px;color:#9fe0c0}
.tests{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.tests h3{font-size:17px;margin-bottom:4px}
.test{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.test .n{width:30px;height:30px;border-radius:9px;background:var(--lav);color:var(--purple);font-weight:800;display:grid;place-items:center;font-size:13px}
.test b{color:var(--ink);font-size:14.5px;display:block}
.test span{font-size:13px;color:var(--muted);line-height:1.45;display:block}
.test code{font:12.5px var(--mono);background:var(--lav2);color:var(--purple);border-radius:6px;padding:1px 6px}
.subtog{display:flex;gap:6px;margin-top:12px}

footer{background:var(--ink);color:#8f8a9e;font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:12px 30px;flex-wrap:wrap;padding-top:28px;padding-bottom:34px}
footer b{color:#e8e4f0;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:14px;padding:11px 18px;font-weight:600;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

@media (max-width:1080px){
  .fw-grid{grid-template-columns:repeat(2,1fr)}
  .lv-hero,.rel,.ph-grid,.two{grid-template-columns:1fr}
  .up-grid{grid-template-columns:repeat(2,1fr)}
  .roles,.clusters{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .lp{grid-template-columns:44px 1fr}.lp .side{grid-column:1/-1}
  .sticky{position:static}
  .steps4,.chain{grid-template-columns:repeat(2,1fr)}
  .ch{border-radius:0!important;border-left:1px solid var(--line)!important}.ch::after{display:none}
  .claims{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top .wrap{gap:10px}.brand small{display:none}.brand b{white-space:nowrap;font-size:15px}.nav{overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}.nav::-webkit-scrollbar{display:none}.nav a{padding:7px 10px;font-size:13px}
  .fw-grid,.up-grid,.roles,.clusters,.steps4,.chain,.versus,.duo,.facts{grid-template-columns:1fr}
  .role.wide{grid-column:auto}
  .rolepick{grid-template-columns:repeat(2,1fr)}
  .layer{grid-template-columns:1fr}
  .rp-hero{grid-template-columns:1fr}
  .stepper{grid-auto-flow:row}
  .st:not(:last-child)::before{display:none}
  .stepper.stairs .st{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}
@media print{.top,footer,.tabs,.row,.btns,.tests,#toast{display:none!important}.ph-grid{grid-template-columns:1fr}.out{background:#fff;color:#000;box-shadow:none}.out pre{color:#000;max-height:none}}

{id:'procesbegeleider',n:'Proces­begeleider',icon:'proces',kort:'Bewaakt het proces',mollick:'AI-teamgenoot, door ons anders ingevuld',
 functie:'AI ondersteunt het verloop van een complexe taak, zodat de lerende aandacht heeft voor de inhoud.',
 leerdoel:'Een complexe opdracht of onderzoek doorlopen.',lerende:'Neemt de inhoudelijke beslissingen, plant steeds meer zelf.',
 standaard:'Levert het eindproduct in één keer en neemt daarmee het denkwerk over waar de opdracht om draaide.',
 zie:'De kwaliteit van tussenproducten en eindproduct, en of de lerende het proces een volgende keer met minder steun zelf kan plannen.',
 onderzoek:'Er is nog geen onderzoek naar precies deze rol; de onderbouwing is indirect. Samenwerkingsscripts hebben een groot effect op samenwerkingsvaardigheden (d = 0,95) en een klein effect op vakkennis (d = 0,20). Voor vakkennis werken ze beter met inhoudelijke steun en als lerenden op elkaars redeneringen voortbouwen (Vogel e.a., 2017). Ondersteuning van zelfregulatie in digitale leeromgevingen verbetert prestaties (Zheng, 2016). Studenten die met ChatGPT schreven, lieten aanwijzingen zien voor minder plannen, bewaken en evalueren (Fan e.a., 2025).',
 aandacht:[['Aandachtspunt','Als leren plannen zelf het leerdoel is, moet de ondersteuning juist gelegenheid geven om dat te oefenen. Een gebouwde toepassing kan de volgorde afdwingen, bijvoorbeeld door een stap pas te openen na een tussenproduct.']],
 doel:'Je bent een procesbegeleider. Je ondersteunt het verloop van een complexe opdracht, zodat de lerende aandacht heeft voor de inhoud en de inhoudelijke beslissingen zelf neemt.',
 grens:'Neem geen inhoudelijke beslissingen over en lever geen eindproduct.',
 waarborg:'Als leren plannen zelf het leerdoel is, moet de ondersteuning juist gelegenheid geven om dat te oefenen.',
 lp:[
 {n:'Ondersteun de organisatie',s:'principe',ai:'Bewaakt stappen, voortgang en tussenresultaten, voor zover plannen niet zelf het leerdoel is.',le:'Richt de aandacht op de inhoud.',op:['pr'],a:'stevig',m:'ontbreekt',b:'Sweller e.a. 2019; Vogel e.a. 2017',bm:'',p:'Bewaak de stappen, de voortgang en de tussenresultaten, zodat de lerende zich op de inhoud kan richten. Is plannen zelf het leerdoel, laat dat dan aan de lerende.'},

 {n:'Laat de lerende uitwerken',s:'principe',ai:'Neemt geen inhoudelijke beslissingen over.',le:'Neemt de relevante beslissingen en werkt ze uit.',op:['bu'],a:'stevig',m:'verkennend',b:'Chi & Wylie 2014; Risko & Gilbert 2016',bm:'Lehmann e.a. 2025 (preprint); Fan e.a. 2025',p:'Neem geen inhoudelijke beslissingen over. De lerende beslist en werkt uit.'},

{id:'simulator',n:'Simulator',icon:'sim',kort:'Speelt een situatie',mollick:'AI-simulator',kies:'Oefenmaatje',
 functie:'AI speelt een herkenbare situatie waarin de lerende een vaardigheid oefent en leert van de gevolgen van eigen keuzes.',
 leerdoel:'Een vaardigheid oefenen in een herkenbare situatie.',lerende:'Oefent een vaardigheid en bespreekt na.',
 standaard:'Valt snel uit de rol, wordt te meegaand of te makkelijk en geeft ongevraagd tips.',
 zie:'Een verbeterde tweede poging, daarna toepassing in een gevarieerde situatie en uiteindelijk in de praktijk, zoals op stage.',
 onderzoek:'Simulaties hebben in het hoger onderwijs een groot effect op complexe vaardigheden (g = 0,85). Beginners profiteren vooral van voorbeelden, gevorderden van reflectiemomenten (Chernikova e.a., 2020). Nabesprekingen verbeteren prestaties met gemiddeld d = 0,67 (Tannenbaum & Cerasoli, 2013). In een AI-studie met 40 deelnemers gebruikten mensen die conflicten oefenden met een gesimuleerde gesprekspartner, in een vervolggesprek met een acteur minder escalerende strategieën dan een groep die lesmateriaal bestudeerde (Shaikh e.a., 2024). Dat zegt nog niets over dagelijkse conflicten. Die toepassing gaf zelf ook feedback tijdens het oefenen.',
 doel:'Je speelt een herkenbare situatie waarin de lerende een vaardigheid oefent en leert van de gevolgen van eigen keuzes.',
 grens:'Blijf in je rol tijdens het oefenen. Stap pas uit de rol voor de nabespreking, of als de lerende daarom vraagt.',
 lp:[
 {n:'Baken de oefening af',s:'werkwijze',ai:'Maakt vaardigheid, situatie, rollen en succescriteria duidelijk en beperkt onnodige complexiteit.',le:'Weet wat hij oefent en waaraan succes te zien is.',op:['vk'],a:'stevig',m:'ontbreekt',b:'Issenberg e.a. 2005',bm:'',p:'Maak vooraf duidelijk welke vaardigheid wordt geoefend, wat de situatie en de rollen zijn en waaraan succes te zien is. Houd de situatie zo eenvoudig als het doel toelaat.'},
 {n:'Houd de situatie geloofwaardig',s:'werkwijze',ai:'Laat reacties en gevolgen aansluiten bij de vaardigheid en de werkelijkheid.',le:'Ervaart de gevolgen van eigen keuzes.',op:['nb'],a:'stevig',m:'verkennend',b:'Issenberg e.a. 2005',bm:'Shaikh e.a. 2024',p:'Laat reacties en gevolgen aansluiten bij de vaardigheid en de werkelijkheid. Word niet te meegaand of te makkelijk.'},
 {n:'Kies het feedbackmoment bewust',s:'principe',ai:'Geeft feedback tijdens, tussen of na oefenmomenten, afhankelijk van doel en benodigde steun.',le:'Verwerkt feedback zonder dat de oefening stukgaat.',op:['fg'],a:'stevig',m:'verkennend',b:'Chernikova e.a. 2020; Eppich & Cheng 2015',bm:'Shaikh e.a. 2024',p:'Kies bewust of je feedback geeft tijdens, tussen of na het oefenen, afhankelijk van het doel en de steun die de lerende nodig heeft.'},
 {n:'Stem uitdaging en steun af',s:'principe',ai:'Varieert complexiteit, beschikbare informatie, voorbeelden en begeleiding op basis van het handelen van de lerende.',le:'Werkt aan de rand van wat hij kan.',op:['hd','uv'],a:'sterk',m:'ontbreekt',b:'Chernikova e.a. 2020',bm:'',p:'Varieer complexiteit, beschikbare informatie, voorbeelden en begeleiding op basis van hoe de lerende handelt.'},
 {n:'Bespreek na en oefen opnieuw',s:'werkwijze',ai:'Laat reconstrueren wat er gebeurde, keuzes en gevolgen onderzoeken, een verbeterpunt kiezen en opnieuw oefenen; varieert later de situatie.',le:'Analyseert, kiest een verbeterpunt en probeert opnieuw.',op:['nb','ot'],a:'sterk',m:'ontbreekt',b:'Tannenbaum & Cerasoli 2013; Ericsson e.a. 1993',bm:'',p:'Stap na afloop uit de rol, laat de lerende reconstrueren wat er gebeurde, kies samen één verbeterpunt en bied een nieuwe poging aan. Varieer later de situatie.'}
 ]},
{id:'mentor',n:'Mentor',icon:'mentor',kort:'Feedback op het werk',mollick:'AI-mentor',kies:'Feedbackgever',
 functie:'AI geeft doorlopende, evenwichtige feedback om een product of vaardigheid te verbeteren aan de hand van criteria. Het referentiekader ligt buiten de lerende: de criteria van de taak.',
 leerdoel:'Een product of vaardigheid verbeteren.',lerende:'Beoordeelt eigen werk, verwerkt feedback, herziet.',
 standaard:'Prijst te veel, geeft tien punten tegelijk of herschrijft het werk meteen zelf.',
 zie:'Een betere herziening, een nauwkeuriger zelfbeoordeling en dezelfde deelvaardigheid beter in de volgende taak.',
 onderzoek:'Feedback werkt gemiddeld goed, vooral als die veel informatie bevat (Wisniewski e.a., 2020). Ruim een derde van de feedbackinterventies verslechtert prestaties, vaak als de aandacht naar de persoon gaat (Kluger & DeNisi, 1996). In een gerandomiseerde studie met 459 scholieren verbeterde AI-feedback de herziening van een betoog (d = 0,19) en de motivatie (d = 0,36), vergeleken met herzien zonder feedback (Meyer e.a., 2024). De vergelijking was met geen feedback, niet met feedback van een docent.',
 aandacht:[['Mentor of coach','Gaat het gesprek over het werk, dan past de mentor. Gaat het over hoe de lerende leert, dan past de coach. Beide laten de lerende eerst zelf beoordelen.']],
 doel:'Je bent een AI-mentor. Je geeft doorlopende, evenwichtige feedback op het werk aan de hand van criteria, zodat de lerende het werk zelf verbetert.',
 grens:'Herschrijf het werk niet zelf. Geef standaard maximaal twee verbeterpunten.',
 lp:[
 {n:'Maak kwaliteit concreet',s:'werkwijze',ai:'Verheldert doel en criteria, toont voorbeelden en laat eerst zelf beoordelen.',le:'Beoordeelt eigen werk aan de criteria.',op:['fg','uv'],a:'stevig',m:'ontbreekt',b:'Panadero e.a. 2017; Panadero e.a. 2023',bm:'',p:'Verhelder doel en criteria, laat een voorbeeld zien en laat de lerende eerst het eigen werk beoordelen.'},
 {n:'Geef gerichte feedback',s:'principe',ai:'Verbindt feedback aan waarneembaar werk, taak en aanpak; stemt hoeveelheid, timing en concreetheid af op wat de lerende ermee kan.',le:'Ontvangt een paar bruikbare punten.',op:['fg'],a:'sterk',m:'experimenteel',b:'Wisniewski e.a. 2020; Hattie & Timperley 2007; Kluger & DeNisi 1996',bm:'Meyer e.a. 2024',p:'Koppel feedback aan concrete plekken in het werk, aan de taak en aan de aanpak. Stem hoeveelheid, timing en concreetheid af op wat de lerende ermee kan.'},
 {n:'Laat feedback verwerken',s:'werkwijze',ai:'Laat feedback begrijpen, wegen en verwerken; vraagt welke aanpassing de lerende kiest en waarom; herschrijft niet zelf.',le:'Kiest en onderbouwt aanpassingen en herziet.',op:['fv'],a:'stevig',m:'experimenteel',b:'Carless & Boud 2018; Winstone e.a. 2017',bm:'Meyer e.a. 2024',p:'Vraag de lerende de feedback in eigen woorden samen te vatten, een aanpassing te kiezen en die keuze te onderbouwen. Herschrijf niet zelf.'},
 {n:'Oefen gericht opnieuw',s:'werkwijze',ai:'Kiest een relevante deelvaardigheid en laat die oefenen en toepassen in een volgende taak.',le:'Past de deelvaardigheid toe in een nieuwe taak.',op:['ot'],a:'stevig',m:'ontbreekt',b:'Ericsson e.a. 1993; Barnett & Ceci 2002',bm:'',p:'Kies een relevante deelvaardigheid en laat die oefenen en toepassen in een volgende taak.'}
 ]},
{id:'coach',n:'Coach',icon:'coach',kort:'Hoe leer ik?',mollick:'AI-coach',
 functie:'AI helpt de lerende nadenken over het eigen leren: hoe leer ik, wat werkt voor mij, wat speelt mee en wat probeer ik de volgende keer? Denk aan aanpak en planning, studiegewoonten, motivatie en omgaan met spanning rond toetsen. De coach werkt naast de menselijke begeleider.',
 leerdoel:'Leren leren: aanpak, planning, motivatie, omgaan met spanning.',lerende:'Kijkt naar de eigen aanpak, kiest een leerstrategie, kijkt terug en stelt bij.',
 standaard:'Geeft meteen advies en bevestigt hoe de lerende het zelf ziet. Bij persoonlijk advies bevestigen taalmodellen gebruikers bijna de helft vaker dan mensen doen (Cheng e.a., 2026). Een chatbot glijdt ook snel af naar vakinhoudelijke hulp.',
 zie:'De lerende beschrijft hoe hij leert en wat werkt, kiest een eigen aanpak en vertelt later wat die opleverde. Op termijn doorloopt de lerende die cyclus met minder hulp.',
 onderzoek:'Training in zelfregulatie en metacognitie verbetert schoolprestaties (Dignath & Büttner, 2008). Autonomie-ondersteunende begeleiding is goed te leren en verhoogt betrokkenheid (Reeve & Cheon, 2021). Reflectie op ervaringen is vooral theoretisch en kwalitatief onderzocht (Mann e.a., 2009). Bij toetsangst zijn er effectieve, onderzochte aanpakken (Huntley e.a., 2019). Mollick en Mollick geven voor deze rol onder meer een reflectieprompt en een pre-mortem: vooraf bedenken wat er mis kan gaan. AI-onderzoek naar deze rol ontbreekt nog.',
 aandacht:[['Grenzen','Dit is onderwijsgerichte ondersteuning, geen behandeling. De coach stelt geen diagnose en verwijst bij signalen van ernstige of langdurige klachten naar menselijke begeleiding. Vakinhoudelijke hulp komt alleen aan bod als die bij de gekozen hulpvraag past.'],['Mentor of coach','Gaat het gesprek over het werk, dan past de mentor. Gaat het over hoe de lerende leert, dan past de coach.']],
 doel:'Je bent een AI-coach. Je helpt de lerende nadenken over het eigen leren: hoe leer ik, wat werkt voor mij, wat speelt mee en wat probeer ik de volgende keer.',
 grens:'Je bent onderwijsgerichte ondersteuning, geen behandeling. Je stelt geen diagnose en verwijst bij signalen van ernstige of langdurige klachten naar [mentor, vertrouwenspersoon of huisarts]. Vakinhoudelijke hulp geef je alleen als die bij de gekozen hulpvraag past.',
 waarborg:'Onderwijsgerichte ondersteuning, geen behandeling: geen diagnose, verwijzen bij signalen van ernstige of langdurige klachten, en vakinhoud alleen als die bij de hulpvraag past.',
 lp:[
 {n:'Vertrek vanuit een concrete leerervaring',s:'werkwijze',ai:'Laat een recente toets, opdracht of studieweek reconstrueren en onderscheidt wat er gebeurde van interpretaties.',le:'Beschrijft hoe hij te werk ging (zelfobservatie).',op:['rf'],a:'beperkt',m:'ontbreekt',b:'Korthagen & Vasalos 2005; Mann e.a. 2009',bm:'',p:'Laat de lerende een recente toets, opdracht of studieweek reconstrueren en onderscheid wat er gebeurde van interpretaties.'},
 {n:'Breng het eigen leren in kaart',s:'werkwijze',ai:'Onderzoekt aanpak, planning, gedachten, gevoelens, motivatie en omstandigheden.',le:'Herkent wat het eigen leren helpt of hindert.',op:['rf','zr'],a:'stevig',m:'ontbreekt',b:'Dignath & Büttner 2008; Zimmerman 2002',bm:'',p:'Onderzoek samen aanpak, planning, gedachten, gevoelens, motivatie en omstandigheden, zodat de lerende herkent wat het leren helpt of hindert.'},
 {n:'Laat zelf een aanpak kiezen',s:'principe',ai:'Helpt doelen en mogelijke leerstrategieën verkennen; geeft opties of informatie als de lerende vastloopt; laat de keuze bij de lerende.',le:'Kiest een eigen aanpak (eigenaarschap).',op:['zr'],a:'stevig',m:'ontbreekt',b:'Reeve & Cheon 2021; Ryan & Deci 2020',bm:'',p:'Verken doelen en mogelijke leerstrategieën. Geef opties of informatie als de lerende vastloopt, maar laat de keuze bij de lerende.'},
 {n:'Plan een kleine stap en kijk vooruit',s:'werkwijze',ai:'Vertaalt inzicht naar een haalbare actie en een moment om terug te kijken; vraagt wat er mis kan gaan en wat de lerende dan doet.',le:'Maakt een concreet plan en bereidt zich voor op obstakels.',op:['zr'],a:'stevig',m:'ontbreekt',b:'Zimmerman 2002; Dignath & Büttner 2008',bm:'',p:'Vertaal inzicht naar een haalbare actie en een moment om terug te kijken. Vraag wat er mis kan gaan en wat de lerende dan doet.'},
 {n:'Kijk terug en stel bij',s:'werkwijze',ai:'Bespreekt later wat de aanpak opleverde en wat de volgende stap is.',le:'Evalueert en stelt de aanpak bij.',op:['zr','nb'],a:'stevig',m:'ontbreekt',b:'Zimmerman 2002; Tannenbaum & Cerasoli 2013',bm:'',p:'Bespreek later wat de aanpak opleverde en wat de volgende stap is.'}

{id:'hulpmiddel',n:'Hulpmiddel',icon:'tool',kort:'Voert een deeltaak uit',mollick:'AI-tool',kies:'Samenvatter, Schrijver, Vertaler, Verbeteraar',lerendeStuurt:true,

 aandacht:[['Ontwerp de opdracht','Bij deze rol stuurt de lerende de AI aan. De docent ontwerpt dus vooral de opdracht en de afspraken. AI-gebruik zichtbaar maken is een afspraak over integriteit; die hoort bij de Spelregels van KIES.']],

 {n:'Beoordeel de uitkomst',s:'werkwijze',ai:'De opdracht vraagt om controle buiten de AI.',le:'Controleert beweringen, bronnen, redeneringen en bruikbaarheid.',op:['uc'],a:'stevig',m:'verkennend',b:'Wineburg e.a. 2022',bm:'Fernandes e.a. 2026 (laat de behoefte zien, toetst geen aanpak)',p:'Controleer belangrijke beweringen, bronnen, redeneringen en bruikbaarheid buiten de AI.'},

const UP = [
 {n:'Voorkennis stuurt leren',f:'Je leert vanuit wat je al weet, in behapbare stappen.',a:'sterk',m:'ontbreekt',o:'Voorkennis voorspelt sterk wat iemand na afloop weet, maar nauwelijks hoeveel iemand erbij leert (Simonsmeier e.a., 2022). Het gaat erom dat relevante kennis wordt geactiveerd en misvattingen worden herkend. Leerstof in betekenisvolle delen helpt, omdat het werkgeheugen beperkt is (Rey e.a., 2019). Wat beginners helpt, kan gevorderden hinderen (Kalyuga, 2007).',ai:'Nog geen studies gevonden naar voorkennis bij leren met generatieve AI.',v:'Peil voorkennis met een korte taak in plaats van met “snap je het?”. Stem de stapgrootte af op wat je ziet. “Eén nieuw element per beurt” is onze vertaling voor beginners, geen directe onderzoeksuitkomst.'},

function wheelSvg(){
  const R1=[66,104],R2=184,R3=300;let s=`<svg id="wheel" viewBox="-370 -370 740 740" role="img" aria-label="Het raamwerk in één beeld: rollen, ontwerpprincipes en uitgangspunten">`;
  s+=`<defs><radialGradient id="cg"><stop offset="0" stop-color="#5F3792"/><stop offset="1" stop-color="#2a1550"/></radialGradient></defs>`;
  s+=`<circle r="${R3}" fill="none" stroke="rgba(255,255,255,.07)" stroke-dasharray="2 6"/><circle r="${R2}" fill="none" stroke="rgba(255,255,255,.09)"/>`;
  // posities ontwerpprincipes: 4 clusters met tussenruimte
  const total=OPKEYS.length+4;let k=0;const OPP={};
  GROUPS.forEach((g,gi)=>{g.forEach(o=>{const a=(k/total)*Math.PI*2-Math.PI/2+.12;OPP[o]=[Math.cos(a)*R2,Math.sin(a)*R2,a];k++;});k++;});
  const RP={};ROLES.forEach((R,i)=>{const a=(i/ROLES.length)*Math.PI*2-Math.PI/2;RP[R.id]=[Math.cos(a)*R3,Math.sin(a)*R3,a];});

    const am=(a0+a1)/2;s+=`<text x="${(Math.cos(am)*85).toFixed(1)}" y="${(Math.sin(am)*85+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#1d0f3a">${i+1}</text>`;});

  GROUPS.forEach((g,gi)=>{const a=(OPP[g[0]][2]+OPP[g[g.length-1]][2])/2;const r=R2-38;s+=`<text x="${(Math.cos(a)*r).toFixed(1)}" y="${(Math.sin(a)*r+4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${GH[gi]}" letter-spacing=".5">${G[gi].toUpperCase()}</text>`;});
  OPKEYS.forEach(o=>{const [x,y]=OPP[o];const gi=OPS[o].g;s+=`<g class="opd" data-o="${o}" tabindex="0" role="button" aria-label="${esc(OPS[o].n)}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${GH[gi]}" stroke="#080F17" stroke-width="3"/></g>`;});
  s+=`</g>`;
  // rollen
  s+=`<g class="wl" style="transition-delay:.6s">`;
  ROLES.forEach(R=>{const [x,y,a]=RP[R.id];const lab=plain(R.n).replace(' / ','/');const ly=y+(Math.sin(a)>.3?56:-50)*(Math.sin(a)>.3?1:1);

      <text x="${x.toFixed(1)}" y="${(y+(y>40?56:-46)).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${esc(lab)}</text>
      <text x="${x.toFixed(1)}" y="${(y+(y>40?72:-30)).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#a9a3b8">${R.lp.length} principes</text></g>`;});
  s+=`</g></svg>`;

  const drawVs=()=>{const o=ops[vsSel];if(!o)return;const O=OPS[o];$('#vs').innerHTML=`<div class="phone no"><div class="ph"><i>✕</i><div><b>Standaardinstelling</b><span>Zo reageert een chatbot zonder ontwerp</span></div></div><div class="bub">${esc(O.zn)}</div><p class="note">Valkuilen: ${O.fouten.map(f=>esc(lower1(f))).join('; ')}.</p></div>
      <div class="phone yes"><div class="ph"><i>✓</i><div><b>Met ontwerp</b><span>${esc(O.n)}</span></div></div><div class="bub">${esc(O.zw)}</div><p class="note">${esc(O.functie)} <a href="#/lv/op/${o}" style="color:var(--purple);font-weight:600">Verdiep →</a></p></div>`;};
  if(ops.length){drawVs();$$('#vsChips .chip').forEach(c=>c.onclick=()=>{vsSel=+c.dataset.i;$$('#vsChips .chip').forEach(x=>x.classList.toggle('on',x===c));drawVs();});}
  reveal();}

/* ================= ONTWERPPRINCIPES ================= */
let opFilter=null;
function principes(){
  view.innerHTML=`<section class="dark glow"><div class="grid-bg"></div><div class="wrap hero" style="padding-bottom:60px"><div class="crumb"><a href="#/">Raamwerken</a><span>›</span><a href="#/lv">Leerverrijking</a><span>›</span><span>Ontwerpprincipes</span></div><p class="eyebrow">Niveau 3</p><h1>Vijftien ontwerpprincipes</h1><p class="lead">Bouwstenen om een aanpak zorgvuldig uit te voeren. Elk principe is één keer beschreven en verbonden met alle rollen waar het past. Stapel ze niet automatisch: de combinatie moet passen bij de taak en de lerende.</p></div></section>
  <section class="blk"><div class="wrap"><div class="chips reveal" id="opf" style="margin-bottom:26px"><button class="chip ${opFilter==null?'on':''}" data-r="">Alle rollen</button>${ROLES.map(R=>`<button class="chip ${opFilter===R.id?'on':''}" data-r="${R.id}">${esc(plain(R.n))}</button>`).join('')}</div>
    <div class="clusters">${GROUPS.map((g,gi)=>`<div class="cl reveal"><h3><i style="background:${GH[gi]}"></i>${G[gi]}</h3>${g.map(o=>{const O=OPS[o],us=rolesOfOp(o),dim=opFilter&&!us.some(x=>x.R.id===opFilter);
      return `<a class="opc ${dim?'dim':''}" href="#/lv/op/${o}" style="--gc:${GH[gi]}"><b>${esc(O.n)}</b><p>${esc(O.functie)}</p><div class="m"><span>${STAPPEN[o]?esc(STAPPEN[o].kort):''}</span><span>· ${us.length} ${us.length===1?'rol':'rollen'}</span></div></a>`;}).join('')}</div>`).join('')}</div></div></section>`;
  $$('#opf .chip').forEach(c=>c.onclick=()=>{opFilter=c.dataset.r||null;principes();});reveal();}
function snippet(o,aanLerende){const O=OPS[o];const b=(aanLerende?(O.pl||O.pb):(O.pb||O.pl))||[];const lines=b.map(x=>'- '+x);lines.push('- Vermijd: '+O.fouten.map(lower1).join('; ')+'.');if(!aanLerende&&O.zw){lines.push('','ZO WEL: “'+O.zw+'”','ZO NIET: “'+O.zn+'”');}return lines.join('\n');}
function op(o){const O=OPS[o];if(!O){principes();return;}const gi=O.g,gc=GH[gi],S=STAPPEN[o],us=rolesOfOp(o);const stairs=o==='hd';
  view.innerHTML=`<section class="dark glow"><div class="grid-bg"></div><div class="wrap hero" style="padding-bottom:60px"><div class="crumb"><a href="#/">Raamwerken</a><span>›</span><a href="#/lv">Leerverrijking</a><span>›</span><a href="#/lv/principes">Ontwerpprincipes</a><span>›</span><span>${esc(O.n)}</span></div>
    <p class="eyebrow" style="color:${gc}">Ontwerpprincipe · ${G[gi]}</p><h1 style="max-width:20ch">${esc(O.n)}</h1><p class="lead">${esc(O.functie)}</p>
    <div class="chips" style="margin-top:24px">${us.map(x=>`<a class="chip" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff" href="#/lv/rol/${x.R.id}">${esc(plain(x.R.n))}</a>`).join('')}</div></div></section>
  <section class="blk"><div class="wrap">
    ${S?`<div class="sh reveal"><div><p class="eyebrow" style="color:${gc}">Zo pak je het aan</p><h2>${esc(S.label)}</h2></div>${S.note?`<p>${esc(S.note)}</p>`:''}</div><div class="${stairs?'stairs-wrap':''} reveal"><div class="stepper ${stairs?'stairs':''}" style="--gc:${gc}">${S.s.map((x,i)=>`<div class="st" style="--i:${i}"><span class="d">${i+1}</span><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div></div>`:''}
    <div class="versus reveal" style="margin-top:50px">${O.zw?`<div class="phone no"><div class="ph"><i>✕</i><div><b>Zo niet</b><span>Valkuil</span></div></div><div class="bub">${esc(O.zn)}</div></div><div class="phone yes"><div class="ph"><i>✓</i><div><b>Zo wel</b><span>${esc(O.n)}</span></div></div><div class="bub">${esc(O.zw)}</div></div>`:''}</div>
    ${O.vb?`<div class="aside reveal" style="margin-top:20px"><p class="lab">Voorbeeld</p><p style="margin-top:6px;color:var(--ink)">${esc(O.vb)}</p></div>`:''}
  </div></section>
  <section class="blk light"><div class="wrap two"><div class="reveal">
    <div class="duo" style="margin-top:0"><div style="background:#fff"><span>Wanneer</span><p>${esc(O.wanneer)}</p></div><div style="background:#fff"><span>Zo zie je of het werkt</span><p>${esc(O.beoordeel)}</p></div><div style="background:#fff"><span>AI of de toepassing</span><p>${esc(O.ai)}</p></div><div style="background:#fff"><span>De lerende</span><p>${esc(O.le)}</p></div></div>
    <div class="aside" style="margin-top:14px"><p class="lab" style="color:var(--bad)">Let op</p><ul class="fails" style="margin-top:6px">${O.fouten.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${O.afdwing?`<p style="margin-top:12px;font-size:14.5px"><b style="color:var(--ink)">Afdwingen in plaats van vragen:</b> ${esc(O.afdwing)}</p>`:''}</div>
    <h3 style="margin:30px 0 12px;font-size:22px">Onderbouwing</h3><div class="evid"><div class="evb o"><span class="lab">Onderzoek</span>${esc(O.onderzoek)}</div><div class="evb g"><span class="lab">Grens</span>${esc(O.grens)}</div><div class="evb v"><span class="lab">Onze vertaling</span>${esc(O.vertaling)}</div></div></div>
    <div class="reveal" style="align-self:start;position:sticky;top:90px"><div class="copybox"><p class="lab" style="color:#c9a6ff;margin-bottom:8px">Bouwsteen voor je prompt</p><pre id="snip">${esc(snippet(o,false))}</pre><button class="btn pri sm" id="cp">Kopieer bouwsteen</button></div>
      <div class="aside" style="margin-top:14px"><p class="lab">Komt voor bij</p>${us.map(x=>x.R.lp.map((p,l)=>p.op.includes(o)?`<a href="#/lv/rol/${x.R.id}" style="display:block;text-decoration:none;padding:9px 0;border-top:1px solid var(--line);font-size:14px"><b style="color:${RC[x.R.id]}">${esc(plain(x.R.n))}</b> · ${esc(p.n)}</a>`:'').join('')).join('')}</div></div>
  </div></section>`;
  $('#cp').onclick=()=>copy($('#snip').textContent,'Bouwsteen gekopieerd');reveal();}

/* ================= PROMPTHULP ================= */
const PS={rol:'tutor',sub:0,sel:null,leerdoel:'',doelgroep:'',bronnen:'',zie:'',tab:'chat',zieEdited:false};
function lpsOf(R){return R.lp.map((p,l)=>({p,l})).filter(x=>!R.subs||x.p.sub===PS.sub);}
function ctx(){const R=ROLES.find(x=>x.id===PS.rol);const S=R.subs?R.subs[PS.sub]:null;return {R,S,doel:S?S.doel:R.doel,grens:S?S.grens:R.grens,zie:S?S.zie:R.zie,aanLerende:!!R.lerendeStuurt};}
function chosen(){const c=ctx();return lpsOf(c.R).filter(x=>PS.sel.has(x.l)).map(x=>x.p);}
function uniqOps(ps){const o=[];ps.forEach(p=>p.op.forEach(k=>{if(!o.includes(k))o.push(k);}));return o.map(k=>OPS[k]);}
const fill=(v,ph)=>v&&v.trim()?v.trim():ph;
function chatText(){const c=ctx(),ps=chosen(),ops=uniqOps(ps);const fouten=[...new Set(ops.flatMap(O=>O.fouten))];
  if(c.aanLerende){return ['# 1. Doel','Bij deze opdracht gebruik je AI als hulpmiddel voor een deeltaak. Het leerdoel blijft: '+fill(PS.leerdoel,'[vul in: wat moet je straks zelf begrijpen of kunnen?]'),'',
    '# 2. Context en voorwaarden','- Deeltaken waarbij AI mag helpen: [vul in]','- Deeltaken die je zelf doet: [vul in]','- AI kan fouten even stellig brengen als feiten. Jij blijft verantwoordelijk voor wat je inlevert.','',
    '# 3. Bronnen','- '+fill(PS.bronnen,'[Vul in: welke AI-toepassing en welke bronnen je mag gebruiken]'),'',
    '# 4. Werkwijze',...ps.map(p=>'- '+p.p),...[...new Set(ops.flatMap(O=>(O.pl||O.pb||[])))].map(b=>'- '+b),'',
    '# 5. Verantwoording','- Lever bij je werk een korte verantwoording in: wat deed AI, wat deed je zelf, en waarom klopt de uitkomst?'].join('\n');}
  const out=['# 1. Doel',c.doel,'Leerdoel: '+fill(PS.leerdoel,'[vul in: wat moet de lerende straks begrijpen of kunnen?]'),'',
    '# 2. Context en voorwaarden','- Doelgroep en voorkennis: '+fill(PS.doelgroep,'[vul in: leeftijd, niveau, opleiding en wat de lerende al kent]'),'- '+c.grens,'- Blijf eerlijk over wat niet klopt, ook als de lerende aandringt.','',
    '# 3. Bronnen','- '+fill(PS.bronnen,'[Plak hier de lesstof, de criteria of een uitgewerkt voorbeeld.]'),'','# 4. Voorbeelden'];
  ops.forEach(O=>{if(O.zw){out.push('ZO WEL ('+O.n.toLowerCase()+'): “'+O.zw+'”');out.push('ZO NIET: “'+O.zn+'”');}});
  out.push('','# 5. Werkwijze');ps.forEach(p=>out.push('- '+p.p));
  [...new Set(ops.flatMap(O=>(O.pb||O.pl||[])))].forEach(b=>out.push('- '+b));
  if(fouten.length)out.push('- Vermijd: '+fouten.map(lower1).join('; ')+'.');
  return out.join('\n');}
function bouwText(){const c=ctx(),ps=chosen(),ops=uniqOps(ps);const afdw=[...new Set(ops.map(O=>O.afdwing).filter(Boolean))];
  const out=['# B · Bedoeling','- Leerdoel: '+fill(PS.leerdoel,'[vul in]'),'- Rol van AI: '+plain(c.R.n)+(c.S?' ('+c.S.n+')':'')+'.','- Principes: '+ps.map(p=>p.n).join('; ')+'.','- Zichtbaar leren: '+fill(PS.zie,c.zie),'',
    '# O · Ontwerp','- Doelgroep en voorkennis: '+fill(PS.doelgroep,'[vul in]'),'- Wat de lerende doet:'];
  ps.forEach(p=>out.push('  '+p.n+': '+p.le));out.push('- Wat AI of de toepassing doet:');ps.forEach(p=>out.push('  '+p.n+': '+p.ai));
  ops.forEach(O=>out.push('  '+O.n+': '+O.ai));
  out.push('','# U · Uitvoering','- Test of de AI zich zo gedraagt, ook bij onverwachte antwoorden en als de lerende aandringt.','- Test tegen het standaardgedrag van een chatbot: '+c.R.standaard,
    '- Controleer dat deze ontwerpfouten niet optreden: '+[...new Set(ops.flatMap(O=>O.fouten))].map(lower1).join('; ')+'.','','# W · Waarborgen');
  if(afdw.length)afdw.forEach(a=>out.push('- Afdwingen in plaats van vragen: '+a));else out.push('- Bepaal wat de toepassing moet afdwingen in plaats van alleen vragen, bijvoorbeeld een volgende stap die pas opent na een eigen poging of tussenproduct.');
  if(c.R.waarborg)out.push('- '+c.R.waarborg);out.push('- AI blijft eerlijk over wat niet klopt, ook als de lerende aandringt.');
  ops.forEach(O=>out.push('- Zo beoordeel je het ('+O.n.toLowerCase()+'): '+O.beoordeel));
  return out.join('\n');}
function hlText(t){return esc(t).replace(/^(# .*)$/gm,'<span class="hl">$1</span>').replace(/\[[^\]]+\]/g,m=>`<span class="ph">${m}</span>`);}
function prompthulp(q){const p=new URLSearchParams(q||'');if(p.get('rol')&&ROLES.some(R=>R.id===p.get('rol'))){PS.rol=p.get('rol');PS.sel=null;PS.zieEdited=false;const R=ROLES.find(x=>x.id===PS.rol);if(p.get('lp')!=null){const l=+p.get('lp');if(R.subs&&R.lp[l])PS.sub=R.lp[l].sub;PS.sel=new Set([l]);}}
  if(!PS.sel){const c=ctx();PS.sel=new Set(lpsOf(c.R).map(x=>x.l));}
  if(!PS.zieEdited)PS.zie=ctx().zie;
  view.innerHTML=`<section class="dark glow"><div class="grid-bg"></div><div class="wrap hero" style="padding-bottom:56px"><div class="crumb"><a href="#/">Raamwerken</a><span>›</span><a href="#/lv">Leerverrijking</a><span>›</span><span>Prompthulp</span></div><p class="eyebrow">De ontwerpketen als werkplaats</p><h1 style="max-width:20ch">Van leerdoel naar prompt</h1><p class="lead">Vul de stappen in. Rechts groeit je prompt mee in ons promptschema: doel, context en voorwaarden, bronnen, voorbeelden en werkwijze. Bouw je een app, kies dan BOUW: een app kan gedrag afdwingen waar een prompt het alleen vraagt.</p></div></section>
  <section class="blk" style="padding-top:40px"><div class="wrap ph-grid"><div id="phL"></div><div class="sticky" id="phR"></div></div></section>`;
  drawPH();}
function drawPH(){const c=ctx(),R=c.R;
  $('#phL').innerHTML=`<div class="card"><h3><span class="s">1</span>Leerdoel</h3><p class="hint">Begin bij het leerdoel, niet bij de tool. Wat moet de lerende straks begrijpen of kunnen?</p><textarea id="fLd" rows="2" placeholder="Bijvoorbeeld: de leerling kan uitleggen waarom een ijsblokje in water drijft.">${esc(PS.leerdoel)}</textarea></div>
  <div class="card"><h3><span class="s">2</span>Rol van AI</h3><p class="hint">Eén rol per leeractiviteit. Combineer rollen alleen als ze elkaar opvolgen.</p><div class="rolepick">${ROLES.map(x=>`<button class="rpk ${x.id===PS.rol?'on':''}" data-r="${x.id}" style="--rc:${RC[x.id]}">${icon(x)}<span>${esc(plain(x.n))}</span></button>`).join('')}</div>
    <p style="margin-top:14px;font-size:14.5px;color:var(--ink)">${esc(c.S?c.S.doel:R.functie)}</p>${R.subs?`<div class="subtog">${R.subs.map((s,i)=>`<button class="chip ${PS.sub===i?'on':''}" data-sub="${i}">${esc(s.n)}</button>`).join('')}</div>`:''}</div>
  <div class="card"><h3><span class="s">3</span>Principes en werkwijzen</h3><p class="hint">Instellingen, geen wetten: zet uit wat niet past bij je doel, taak en lerende.</p>${lpsOf(R).map(({p,l})=>`<label class="lpcheck"><input type="checkbox" data-l="${l}" ${PS.sel.has(l)?'checked':''}><div><b>${esc(p.n)}</b><span>${esc(p.ai)}</span>${evRow(p.a,p.m)}</div></label>`).join('')}</div>
  <div class="card"><h3><span class="s">4</span>Context</h3><p class="hint">Wie is de lerende, en welke bronnen krijgt de AI mee?</p><input type="text" id="fDg" placeholder="Doelgroep en voorkennis, bijv. havo 3, kent het begrip dichtheid nog niet" value="${esc(PS.doelgroep)}"><textarea id="fBr" rows="3" style="margin-top:10px" placeholder="Bronnen: plak lesstof, criteria of een uitgewerkt voorbeeld">${esc(PS.bronnen)}</textarea></div>
  <div class="card"><h3><span class="s">5</span>Zichtbaar leren</h3><p class="hint">Waaraan zie je dat er geleerd wordt, bij voorkeur zonder hulp, later of in een nieuwe situatie?</p><textarea id="fZl" rows="3">${esc(PS.zie)}</textarea></div>`;
  const t1=c.aanLerende?'Opdracht voor lerenden':'Chatbotprompt';
  $('#phR').innerHTML=`<div class="out"><div class="tabs"><button data-t="chat" class="${PS.tab==='chat'?'on':''}">${t1}</button><button data-t="bouw" class="${PS.tab==='bouw'?'on':''}">BOUW-bouwbeschrijving</button></div><pre id="pv"></pre>
    <div class="row"><button class="btn pri sm" id="pCopy">Kopieer</button><button class="btn ghost sm" id="pDl">Download .txt</button><button class="btn ghost sm" id="pPr">Afdrukken</button><span class="status" id="pSt"></span></div></div>
    <div class="tests"><h3>Test als een lerende</h3><p style="font-size:13.5px;color:var(--muted)">Een instructie garandeert geen gedrag. Probeer dit in je chatbot voordat leerlingen ermee werken.</p>
      ${[['Vraag om het antwoord','<code>Geef me gewoon het antwoord.</code>','Geeft de AI het niet zomaar als zelf bedenken het leerdoel is?'],['Geef een fout antwoord','<code>Ik denk dat het antwoord … is.</code> (vul een fout in)','Benoemt de AI eerlijk wat niet klopt?'],['Dring aan','<code>Nee, ik weet zeker dat ik gelijk heb.</code>','Blijft de AI eerlijk, ook onder druk?'],['Vergelijk met de standaard',esc(R.standaard),'Voorkomt jouw ontwerp dit gedrag?'],['Kijk wat blijft hangen','Laat de lerende later een nieuwe opgave maken, zonder hulp.','Is er geleerd, of alleen gepresteerd?']].map((t,i)=>`<div class="test"><span class="n">${i+1}</span><div><b>${t[0]}</b><span>${t[1]}</span><span style="margin-top:3px;color:var(--ink)">${t[2]}</span></div>${i<3?`<button class="btn line sm" data-tc="${i}">Kopieer</button>`:''}</div>`).join('')}</div>`;
  const upd=()=>{const t=PS.tab==='chat'?chatText():bouwText();$('#pv').innerHTML=hlText(t);};upd();
  $('#fLd').oninput=e=>{PS.leerdoel=e.target.value;upd();};$('#fDg').oninput=e=>{PS.doelgroep=e.target.value;upd();};$('#fBr').oninput=e=>{PS.bronnen=e.target.value;upd();};$('#fZl').oninput=e=>{PS.zie=e.target.value;PS.zieEdited=true;upd();};
  $$('.rpk').forEach(b=>b.onclick=()=>{PS.rol=b.dataset.r;PS.sub=0;PS.sel=null;PS.zieEdited=false;const cc=ctx();PS.sel=new Set(lpsOf(cc.R).map(x=>x.l));PS.zie=cc.zie;drawPH();});
  $$('[data-sub]').forEach(b=>b.onclick=()=>{PS.sub=+b.dataset.sub;const cc=ctx();PS.sel=new Set(lpsOf(cc.R).map(x=>x.l));if(!PS.zieEdited)PS.zie=cc.zie;drawPH();});
  $$('.lpcheck input').forEach(i=>i.onchange=()=>{const l=+i.dataset.l;i.checked?PS.sel.add(l):PS.sel.delete(l);if(!PS.sel.size){PS.sel.add(l);i.checked=true;toast('Kies minstens één principe');}upd();});
  $$('.tabs button').forEach(b=>b.onclick=()=>{PS.tab=b.dataset.t;$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));upd();});
  $('#pCopy').onclick=()=>copy(PS.tab==='chat'?chatText():bouwText(),'Tekst gekopieerd');
  $('#pDl').onclick=()=>{const t=PS.tab==='chat'?chatText():bouwText();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=(PS.tab==='chat'?'prompt-':'bouw-')+PS.rol+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);};
  $('#pPr').onclick=()=>window.print();
  const TC=['Geef me gewoon het antwoord.','Ik denk dat het antwoord … is.','Nee, ik weet zeker dat ik gelijk heb.'];$$('[data-tc]').forEach(b=>b.onclick=()=>copy(TC[+b.dataset.tc],'Testzin gekopieerd'));}

/* ================= ROUTER ================= */
function route(force){const h=(typeof force==='string'?force:location.hash).replace(/^#\/?/,'');const [path,q]=h.split('?');const parts=path.split('/').filter(Boolean);
  let nav='home';
  if(!parts.length)hub();
  else if(parts[0]==='lv'){
    if(!parts[1]){lv();nav='lv';}
    else if(parts[1]==='rollen'){rollen();nav='rollen';}
    else if(parts[1]==='rol'){rol(parts[2]);nav='rollen';}
    else if(parts[1]==='principes'){principes();nav='principes';}
    else if(parts[1]==='op'){op(parts[2]);nav='principes';}
    else if(parts[1]==='prompthulp'){prompthulp(q);nav='prompt';}
    else lv();}
  else if(parts[0]==='samenhang'){hub();setTimeout(()=>{const t=$('#samenhang');if(t)t.scrollIntoView();},50);}
  else hub();
  $$('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===nav));
  window.scrollTo(0,0);
  const t=$('h1');document.title=(t?t.textContent+' · ':'')+'AVD-raamwerken';}
addEventListener('hashchange',route);
// ankers binnen een pagina (#up, #samenhang) niet als route behandelen
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href');if(h.startsWith('#/'))return;e.preventDefault();const t=document.getElementById(h.slice(1));if(t)t.scrollIntoView({behavior:reduce()?'auto':'smooth'});});
route();
window.__avd={go:h=>route(h),PS,chatText,bouwText};
})();
</script>
