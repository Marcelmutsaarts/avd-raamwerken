<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AVD-raamwerken · AI voor Docenten</title>
<meta name="description" content="De onderwijskundige raamwerken van AI voor Docenten in één omgeving: AI-geletterdheid, KIES, BOUW en Leerverrijking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080F17;--ink2:#121a26;--ink3:#1c2533;--text:#3d3f46;--muted:#6B6F74;--line:#e7e3ef;--line2:#d6cfe4;
  --purple:#5F3792;--violet:#A25DF8;--lav:#ECDFFE;--lav2:#f6f1fe;--bg:#fbfaff;--white:#fff;
  --c-geletterd:#7C5CFF;--c-kies:#E0559B;--c-bouw:#25A47E;--c-lv:#A25DF8;
  --g0:#A25DF8;--g1:#F0A23B;--g2:#22A699;--g3:#E0559B;
  --ok:#22a06b;--warn:#e08a1e;--bad:#e5484d;
  --r:20px;--font:Poppins,'Segoe UI',system-ui,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{color:var(--ink);margin:0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left))}
.eyebrow{font:600 12px/1.3 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.dark .eyebrow{color:#c9a6ff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(8,15,23,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:30px;height:30px}
.mark i{border-radius:4px}
.brand b{font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:#a9a3b8;font-weight:500;letter-spacing:.04em;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:#d9d4e6;text-decoration:none;font-size:14px;font-weight:500;padding:8px 13px;border-radius:10px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(162,93,248,.18);color:#fff}
.crumb{font-size:13px;color:#a9a3b8;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.crumb a{text-decoration:none;color:#cbb7f5}
.crumb a:hover{color:#fff}
.light .crumb{color:var(--muted)}.light .crumb a{color:var(--purple)}

/* heroes */
.dark{background:var(--ink);color:#c9c5d3;position:relative;overflow:hidden}
.dark h1,.dark h2,.dark h3{color:#fff}
.glow::before{content:"";position:absolute;inset:-30% -10% auto auto;width:900px;height:900px;background:radial-gradient(closest-side,rgba(162,93,248,.35),transparent 70%);pointer-events:none}
.glow::after{content:"";position:absolute;left:-200px;bottom:-400px;width:800px;height:800px;background:radial-gradient(closest-side,rgba(95,55,146,.45),transparent 70%);pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 30%,#000 30%,transparent 75%);pointer-events:none}
.hero{padding:70px 0 80px;position:relative}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.06;font-weight:800;margin:14px 0 18px;max-width:16ch}
.hero .lead{font-size:clamp(17px,1.6vw,19px);max-width:56ch;color:#d4cfe0}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid transparent;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--violet);color:#fff;box-shadow:0 10px 30px rgba(162,93,248,.35)}
.btn.pri:hover{background:#8d45ef}
.btn.ghost{border-color:rgba(255,255,255,.25);color:#fff;background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.line{border-color:var(--line2);color:var(--ink);background:#fff}
.btn.line:hover{border-color:var(--violet);color:var(--purple)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
section.blk{padding:84px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;margin-bottom:34px}
.sh h2{font-size:clamp(26px,3vw,38px);line-height:1.12;margin-top:8px;max-width:22ch}
.sh p{max-width:52ch;color:var(--muted)}
.light{background:var(--lav2)}

/* hub */
.fw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:-60px;position:relative;z-index:2}
.fw{background:#fff;border-radius:24px;padding:24px 22px 22px;text-decoration:none;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(8,15,23,.12);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.fw:hover{transform:translateY(-4px);box-shadow:0 30px 70px rgba(8,15,23,.18)}
.fw::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
.fw .as{font:600 11.5px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.fw h3{font-size:24px}
.fw p{font-size:14.5px;line-height:1.55}
.fw .keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.fw .keys span{font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);border-radius:8px;padding:4px 8px}
.fw .go{font-weight:600;font-size:14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.fw .tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--lav);color:var(--purple);margin-bottom:-2px}
.fw.feat{background:linear-gradient(160deg,#fff 60%,var(--lav2))}
.fw.feat .tag{background:var(--violet);color:#fff}
.rel{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.rel svg{width:100%;height:auto}
.rel-list{display:grid;gap:12px}
.rel-item{display:grid;grid-template-columns:12px 1fr;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.rel-item i{width:12px;height:12px;border-radius:4px;margin-top:6px}
.rel-item b{color:var(--ink);font-weight:600;display:block;font-size:15px}
.rel-item span{font-size:14px;color:var(--muted)}

/* wiel */
.lv-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,620px);gap:30px;align-items:center}
.wheelbox{position:relative}
#wheel{width:100%;height:auto;display:block;overflow:visible}
#wheel .lnk{fill:none;stroke-width:1.6;opacity:.14;transition:opacity .25s,stroke-width .25s}
#wheel .lnk.on{opacity:.95;stroke-width:2.4}
#wheel .lnk.off{opacity:.03}
#wheel .rn{cursor:pointer}
#wheel .rn circle.bg{transition:all .25s}
#wheel .rn:hover circle.bg,#wheel .rn.on circle.bg{filter:drop-shadow(0 0 14px var(--rc))}
#wheel .rn.dim{opacity:.28}
#wheel .opd{cursor:pointer;transition:opacity .25s}
#wheel .opd circle{transition:r .2s}
#wheel .opd.on circle{r:12}
#wheel .opd.dim{opacity:.22}
#wheel .fseg{cursor:pointer;transition:opacity .2s}
#wheel .fseg:hover{opacity:1!important}
#wheel text{font-family:var(--font);pointer-events:none}
.w-in .wl{opacity:0}
.wl{transition:opacity .8s ease}
.wheel-info{margin-top:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 18px;min-height:112px}
.wheel-info .k{font:600 11px/1.3 var(--font);letter-spacing:.14em;text-transform:uppercase;color:#c9a6ff}
.wheel-info b{display:block;color:#fff;font-size:18px;margin:4px 0 2px}
.wheel-info p{font-size:14px;color:#c3bdd0;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:#a9a3b8}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}

/* bouwlagen / uitgangspunten */
.layers{display:grid;gap:12px}
.layer{display:grid;grid-template-columns:150px 1fr auto;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.layer .n{font:800 34px/1 var(--font);color:var(--violet)}
.layer .n small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.layer b{color:var(--ink);font-size:17px}
.layer p{font-size:14.5px;color:var(--muted)}
.up-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.up{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:border-color .2s,transform .2s}
.up:hover{border-color:var(--violet);transform:translateY(-2px)}
.up .num{font:800 14px/1 var(--font);color:#fff;background:var(--purple);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.up h3{font-size:17px;line-height:1.3}
.up p{font-size:14px;line-height:1.5}
.ev{display:flex;flex-direction:column;gap:5px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line2)}
.evr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.evr .bars{display:flex;gap:3px}
.evr .bars i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.evr .bars i.f{background:var(--purple)}
.evr .bars.ai i.f{background:var(--g2)}
.evr em{font-style:normal;font-weight:600;color:var(--ink)}

/* rollen grid */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.role{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.role:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(95,55,146,.14);border-color:var(--rc)}
.role .ri{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--rc) 13%,#fff);color:var(--rc)}
.role .ri svg{width:34px;height:34px;--ic-bg:color-mix(in srgb,var(--rc) 13%,#fff)}
.role h3{font-size:19px}
.role .k{font-size:14px;color:var(--muted)}
.role .meta{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--rc)}
.role.wide{background:linear-gradient(135deg,var(--ink),#2a1550);color:#d4cfe0;border:0}
.role.wide h3{color:#fff}
svg .t,svg .b{fill:var(--ic-bg,#fff)}

/* keten */
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:10px}
.ch{background:#fff;border:1px solid var(--line);padding:22px 20px;position:relative}
.ch:first-child{border-radius:20px 0 0 20px}.ch:last-child{border-radius:0 20px 20px 0}
.ch+.ch{border-left:0}
.ch .s{font:800 13px/1 var(--font);color:#fff;background:var(--violet);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:12px}
.ch b{color:var(--ink);font-size:16.5px;display:block}
.ch p{font-size:14px;color:var(--muted);margin-top:4px}
.ch:not(:last-child)::after{content:"";position:absolute;right:-11px;top:34px;width:20px;height:20px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg);z-index:1}
.loop{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px;color:var(--muted);font-size:14px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.s4{background:var(--ink);color:#c9c5d3;border-radius:20px;padding:22px}
.s4 .n{font:800 40px/1 var(--font);background:linear-gradient(135deg,#c9a6ff,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.s4 b{color:#fff;display:block;margin:8px 0 4px;font-size:16.5px}
.s4 p{font-size:14px}

/* claims */
.claims{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.claim{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.claim h3{font-size:17px;margin-bottom:6px}
.claim p{font-size:14px;color:var(--muted)}
.scale{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.scale div{display:flex;gap:10px;font-size:13.5px;align-items:flex-start}
.scale div b{min-width:132px;color:var(--ink);font-weight:600;white-space:nowrap}

/* rolpagina */
.rp-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.rp-icon{width:120px;height:120px;border-radius:34px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--rc);box-shadow:0 0 60px color-mix(in srgb,var(--rc) 40%,transparent)}
.rp-icon svg{width:74px;height:74px;--ic-bg:#0f1622}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.fact{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px}
.fact span{font:600 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:#c9a6ff}
.fact p{color:#e8e4f0;font-size:14.5px;margin-top:5px;line-height:1.5}
.versus{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.phone{border-radius:26px;padding:18px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px rgba(8,15,23,.08)}
.phone.no{background:#fff7f7;border-color:#f6d6d6}
.phone.yes{background:#f7fff9;border-color:#cfeedd}
.phone .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phone .ph i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff}
.phone.no .ph i{background:var(--bad)}.phone.yes .ph i{background:var(--ok)}
.phone .ph b{color:var(--ink);display:block;font-size:15.5px}
.phone .ph span{font-size:12.5px;color:var(--muted)}
.bub{border-radius:18px 18px 18px 4px;padding:13px 16px;font-size:15px;line-height:1.55;color:var(--ink);background:#fff;border:1px solid var(--line);position:relative;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phone .note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--text);text-decoration:none}
.chip:hover{border-color:var(--violet);color:var(--purple)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lps{display:grid;gap:14px}
.lp{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:grid;grid-template-columns:44px 1fr 210px;gap:18px 22px}
.lp .no{font:800 15px/1 var(--font);color:#fff;background:var(--rc,var(--purple));width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.lp h3{font-size:19px;line-height:1.3}
.lp .type{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:8px;vertical-align:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.duo>div{background:var(--lav2);border-radius:14px;padding:12px 14px}
.duo span,.lab{font:600 11px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}
.duo p{font-size:14.5px;color:var(--ink);margin-top:4px;line-height:1.5}
.lp .side{display:flex;flex-direction:column;gap:10px}
.lp .src{font-size:12px;color:var(--muted);line-height:1.45}
.lp .opl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.opchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;text-decoration:none;background:#fff;border:1.5px solid var(--line2);border-radius:10px;padding:6px 10px;color:var(--ink)}
.opchip i{width:9px;height:9px;border-radius:50%}
.opchip:hover{border-color:var(--violet)}
.subh{font:700 13px/1.3 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin:18px 0 2px}
.prose p+p{margin-top:12px}
.prose b{color:var(--ink)}
.aside{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.two{display:grid;grid-template-columns:1.3fr .7fr;gap:24px}
.rnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px}

/* bibliotheek */
.clusters{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}
.cl h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--ink)}
.cl h3 i{width:12px;height:12px;border-radius:4px}
.opc{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;margin-bottom:12px;transition:transform .2s,border-color .2s;border-left:4px solid var(--gc)}
.opc:hover{transform:translateY(-2px);border-color:var(--gc)}
.opc b{color:var(--ink);font-size:16px;display:block}
.opc p{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.opc .m{display:flex;gap:10px;margin-top:10px;font-size:12px;font-weight:600;color:var(--gc)}
.opc.dim{opacity:.35}
.stepper{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;position:relative;margin-top:8px}
.st{position:relative;padding:0 10px 0 0}
.st .d{width:42px;height:42px;border-radius:13px;background:var(--gc);color:#fff;font:800 16px/1 var(--font);display:grid;place-items:center;position:relative;z-index:1}
.st:not(:last-child)::before{content:"";position:absolute;left:42px;right:0;top:20px;height:2px;background:color-mix(in srgb,var(--gc) 35%,#fff)}
.st b{display:block;color:var(--ink);font-size:15px;margin-top:12px;line-height:1.35}
.st span{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.stepper.stairs .st{transform:translateY(calc(var(--i)*-10px))}
.stairs-wrap{padding-top:50px}
.evid{display:grid;gap:12px}
.evb{border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.6}
.evb .lab{display:block;margin-bottom:4px}
.evb.o{background:#fff;border:1px solid var(--line)}
.evb.g{background:#fff8ec;border:1px solid #f5dfb8}.evb.g .lab{color:#a8650c}
.evb.v{background:var(--lav2);border:1px dashed var(--line2)}
.fails{margin:0;padding-left:18px}
.fails li{margin:4px 0}
.fails li::marker{color:var(--bad)}
.copybox{background:var(--ink);border-radius:18px;padding:16px;color:#e8e4f0}
.copybox pre{margin:0 0 12px;white-space:pre-wrap;font:13px/1.6 var(--mono);color:#e8e4f0;max-height:340px;overflow:auto}

/* prompthulp */
.ph-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:26px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;margin-bottom:16px}
.card h3{font-size:18px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.card h3 .s{font:800 13px/1 var(--font);color:#fff;background:var(--violet);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.card .hint{font-size:13.5px;color:var(--muted);margin-bottom:12px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line2);border-radius:13px;padding:11px 13px;font:15px/1.5 var(--font);color:var(--ink);background:#fff;outline:0;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(162,93,248,.12)}
.rolepick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rpk{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.25}
.rpk svg{width:28px;height:28px;color:var(--rc);--ic-bg:#fff}
.rpk:hover{border-color:var(--rc)}
.rpk.on{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,#fff)}
.rpk.on svg{--ic-bg:color-mix(in srgb,var(--rc) 10%,#fff)}
.lpcheck{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lpcheck:first-of-type{border-top:0}
.lpcheck input{width:20px;height:20px;accent-color:var(--violet);margin-top:2px}
.lpcheck b{color:var(--ink);font-size:15px;font-weight:600}
.lpcheck span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.lpcheck .evr{margin-top:4px}
.sticky{position:sticky;top:84px}
.out{background:var(--ink);border-radius:24px;padding:18px;color:#e8e4f0;box-shadow:0 30px 60px rgba(8,15,23,.25)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:#a9a3b8;border-radius:9px;padding:8px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--violet);color:#fff}
.out pre{margin:0;white-space:pre-wrap;font:12.8px/1.62 var(--mono);color:#ece8f4;max-height:52vh;overflow:auto;background:rgba(255,255,255,.03);border-radius:14px;padding:14px}
.out pre .hl{color:#c9a6ff;font-weight:700}
.out pre .ph{background:rgba(240,162,59,.18);color:#ffd08a;border-radius:4px}
.out .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.out .btn.ghost{border-color:rgba(255,255,255,.2)}
.status{font-size:13px;color:#9fe0c0}
.tests{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.tests h3{font-size:17px;margin-bottom:4px}
.test{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.test .n{width:30px;height:30px;border-radius:9px;background:var(--lav);color:var(--purple);font-weight:800;display:grid;place-items:center;font-size:13px}
.test b{color:var(--ink);font-size:14.5px;display:block}
.test span{font-size:13px;color:var(--muted);line-height:1.45;display:block}
.test code{font:12.5px var(--mono);background:var(--lav2);color:var(--purple);border-radius:6px;padding:1px 6px}
.subtog{display:flex;gap:6px;margin-top:12px}

footer{background:var(--ink);color:#8f8a9e;font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:12px 30px;flex-wrap:wrap;padding-top:28px;padding-bottom:34px}
footer b{color:#e8e4f0;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:14px;padding:11px 18px;font-weight:600;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

@media (max-width:1080px){
  .fw-grid{grid-template-columns:repeat(2,1fr)}
  .lv-hero,.rel,.ph-grid,.two{grid-template-columns:1fr}
  .up-grid{grid-template-columns:repeat(2,1fr)}
  .roles,.clusters{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .lp{grid-template-columns:44px 1fr}.lp .side{grid-column:1/-1}
  .sticky{position:static}
  .steps4,.chain{grid-template-columns:repeat(2,1fr)}
  .ch{border-radius:0!important;border-left:1px solid var(--line)!important}.ch::after{display:none}
  .claims{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top .wrap{gap:10px}.brand small{display:none}.brand b{white-space:nowrap;font-size:15px}.nav{overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}.nav::-webkit-scrollbar{display:none}.nav a{padding:7px 10px;font-size:13px}
  .fw-grid,.up-grid,.roles,.clusters,.steps4,.chain,.versus,.duo,.facts{grid-template-columns:1fr}
  .role.wide{grid-column:auto}
  .rolepick{grid-template-columns:repeat(2,1fr)}
  .layer{grid-template-columns:1fr}
  .rp-hero{grid-template-columns:1fr}
  .stepper{grid-auto-flow:row}
  .st:not(:last-child)::before{display:none}
  .stepper.stairs .st{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}
@media print{.top,footer,.tabs,.row,.btns,.tests,#toast{display:none!important}.ph-grid{grid-template-columns:1fr}.out{background:#fff;color:#000;box-shadow:none}.out pre{color:#000;max-height:none}}


/* ================= LEERVERRIJKING · ATLAS (uitvergroting) ================= */
:root{--pa:#f4efe6;--pa2:#ebe4d6;--pc:#fbf8f2;--ik:#1d1826;--mu:#6c6377;--ln:#dcd2c2;--ln2:#c9bda8;--pu:#5F3792;--vi:#A25DF8;--lv:#ECDFFE;--te:#2f6f73;--rd:#a8362a;
  --serif:Fraunces,Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif;--amono:'JetBrains Mono',ui-monospace,monospace}
body.atlas{background:var(--pa);color:var(--ik);font-family:var(--sans);--c-geletterd:#4b3f9e;--c-kies:#a8475f;--c-bouw:#2f6f73;--c-lv:#5F3792}
body.atlas #toast{background:var(--ik);color:var(--pa);font:600 13.5px var(--sans);border-radius:4px}
body.atlas>footer{background:transparent;border-top:1px solid var(--ln);color:var(--mu);font:400 13px var(--sans);position:relative;z-index:1}
body.atlas>footer b{color:var(--ik)}
body.atlas.lvmode>footer{display:none}
body.atlas::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(70% 70% at 30% 45%,#000 0%,transparent 75%);mask-image:radial-gradient(70% 70% at 30% 45%,#000 0%,transparent 75%)}
body.atlas .top{background:rgba(244,239,230,.92);border-bottom:1px solid var(--ln);backdrop-filter:blur(8px)}
body.atlas .top .brand{color:var(--ik)}
body.atlas .top .brand b{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:0}
body.atlas .top .brand small{font-family:var(--amono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
body.atlas .nav a{color:var(--ik);font-family:var(--sans);font-weight:500}
body.atlas .nav a:hover{background:var(--pa2);color:var(--ik)}
body.atlas .nav a.on{background:none;color:var(--pu);box-shadow:inset 0 -2px 0 var(--pu);border-radius:0}
/* ================= uitvergroting: fries, strook, bladen ================= */
.uv{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:16px 28px 26px;display:flex;flex-direction:column;min-height:calc(100vh - 65px);min-height:calc(100dvh - 65px)}
.uv-h{position:relative;z-index:5;display:flex;align-items:center;gap:16px;padding:6px 2px 12px;border-bottom:1px solid var(--ln)}
.uv-crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uv-crumb span{color:var(--ik)}.uv-crumb .sep{color:var(--ln2);margin:0 3px}
.uv-stamp{font:600 10.5px var(--amono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);border:1px solid var(--ln2);border-radius:3px;padding:4px 8px;white-space:nowrap}
/* Fig. I: de kop */
.uv-top{display:none;text-align:center;padding:30px 0 4px}
.uv[data-v="over"] .uv-top{display:block}
.uv-h1{font:700 clamp(42px,5.4vw,80px)/.98 var(--serif);letter-spacing:-.028em;color:var(--ik);margin:16px auto 0;max-width:14ch;text-wrap:balance;outline:0}
.uv-h1 em{font-style:italic;font-weight:500;color:var(--pu)}
.uv-lead{font:400 18px/1.6 var(--sans);color:#3a3442;max-width:60ch;margin:20px auto 0}
/* de fries: zeven zegels op een rij */
.fries{position:relative;z-index:3;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:38px}
.fz{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:var(--ik);padding:16px 6px 14px;border-radius:4px}
.fz-s{position:relative;width:92px;height:92px;flex:none;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px var(--pa),0 0 0 5.5px var(--pu),0 24px 34px -18px rgba(60,30,90,.6);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.fz-s::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
.fz-s i{font:700 40px/1 var(--serif);font-style:normal}
.fz-n{font:700 21px/1.12 var(--serif);margin-top:20px;text-wrap:balance;hyphens:manual}
.fz-l{font:italic 400 14.5px/1.35 var(--serif);color:var(--mu);margin-top:6px;text-wrap:balance}
.fz-t{display:flex;gap:4px;margin-top:auto;padding-top:14px;align-items:flex-end;height:28px}
.fz-t b{width:2px;height:9px;background:var(--ln2)}.fz-t b.pr{width:4px;height:14px;background:var(--pu)}
.uv[data-v="over"] .fz:hover .fz-s,.uv[data-v="over"] .fz:focus-visible .fz-s{transform:translateY(-5px);box-shadow:0 0 0 4px var(--pa),0 0 0 5.5px var(--pu),0 30px 40px -18px rgba(60,30,90,.7)}
.uv[data-v="over"] .fz::after{content:"";position:absolute;inset:0;border:1px solid var(--pu);border-radius:4px;opacity:0;transform:scale(.97);transition:opacity .25s,transform .25s;pointer-events:none}
.uv[data-v="over"] .fz:hover::after{opacity:1;transform:none}

/* de strook: dezelfde zegels klein, bovenaan elke uitvergroting */
.uv:not([data-v="over"]) .fries{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:12px;padding:4px 0}
.uv:not([data-v="over"]) .fz{flex-direction:row;gap:9px;padding:6px 6px}
.uv:not([data-v="over"]) .fz-s{width:30px;height:30px;box-shadow:0 0 0 2px var(--pa),0 0 0 3px var(--pu)}
.uv:not([data-v="over"]) .fz-s::before{inset:3px}
.uv:not([data-v="over"]) .fz-s i{font-size:14px}
.uv:not([data-v="over"]) .fz-n{font:600 14px/1.2 var(--serif);margin:0;white-space:nowrap}
.uv:not([data-v="over"]) .fz-l,.uv:not([data-v="over"]) .fz-t{display:none}
.uv:not([data-v="over"]) .fz:hover .fz-n{color:var(--pu)}
.fz.dim{opacity:.4}.fz.dim:hover{opacity:1}
.fz.on .fz-s::after{content:"";position:absolute;inset:-9px;border:1.2px solid var(--pu);border-radius:3px}
.fz.on .fz-n{color:var(--pu)}
.fz.uses{opacity:1}.fz.uses .fz-s{box-shadow:0 0 0 2px var(--pa),0 0 0 3px var(--pu),0 0 0 8px rgba(162,93,248,.25)}
.uv .fries .fz.zd .fz-s{background:var(--pc);color:var(--mu);box-shadow:none;border:1.5px dashed var(--mu)}
.fz.zd .fz-s::before{display:none}
/* het podium */
.stage{position:relative;z-index:2;margin-top:24px;flex:1}
.uv[data-v="over"] .stage{margin-top:26px}
.panel{position:relative;background:var(--pc);border:1px solid var(--ln);border-radius:6px;padding:30px 36px 18px;box-shadow:0 1px 0 #fff inset,0 44px 70px -48px rgba(60,40,30,.55)}
.panel::after{content:"";position:absolute;inset:6px;border:1px solid var(--ln);border-radius:3px;pointer-events:none;opacity:.6}
.pn-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:46px}
.panel.pv-pr .pn-grid{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr)}
.pn-grid>.pn-r{border-left:1px solid var(--ln);padding-left:42px}
@media (min-width:761px) and (min-height:801px){body:not(.lvbig) .panel.pv-pr .pn-l{position:sticky;top:78px;align-self:start}}
.uv[data-v="lib"] .fries{position:sticky;top:65px;z-index:6;background:var(--pa);box-shadow:0 1px 0 var(--ln)}
.pn-id{display:flex;align-items:center;gap:22px}
.hseal.xl{width:74px;height:74px;font-size:33px;flex:none;box-shadow:0 0 0 4px var(--pc),0 0 0 5.5px var(--pu)}
.hseal.xl.zd{box-shadow:none}
.pn-h1{font:700 clamp(36px,3.8vw,58px)/1 var(--serif);letter-spacing:-.022em;color:var(--ik);margin:6px 0 0;outline:0;text-wrap:balance}
.panel.pv-pr .pn-h1{font-size:clamp(30px,3vw,46px);margin-top:12px}
.panel .lsub{font-size:17.5px}
.panel .lnk{font:600 12.5px var(--sans);color:var(--pu)}
.lk.sm{font-size:12.5px}
.rfacts{margin:20px 0 0;display:grid;gap:10px}
.rfacts div{display:grid;grid-template-columns:128px 1fr;gap:12px;border-top:1px solid var(--ln);padding-top:10px}
.rfacts dt{font:600 10.5px/1.7 var(--amono);letter-spacing:.12em;text-transform:uppercase;color:var(--pu)}
.rfacts dd{margin:0;font:400 15px/1.5 var(--sans);color:var(--ik)}
.rfacts .no dt{color:var(--rd)}.rfacts .no dd{color:var(--mu);font:italic 400 15.5px/1.5 var(--serif)}
/* Fig. II: de principes als register a, b, c */
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln)}
.plist li{border-bottom:1px solid var(--ln)}
.plist a{display:grid;grid-template-columns:1fr 22px;gap:14px;align-items:center;padding:13px 6px;text-decoration:none;color:var(--ik);transition:background .2s}
.plist a>i{position:relative;font:italic 500 46px/1 var(--serif);color:var(--pu);text-align:center}
.plist a:hover{background:rgba(236,223,254,.4)}
.plist a:hover>i::after,.plist a:focus-visible>i::after{content:"";position:absolute;inset:-5px 3px;border:1px solid var(--pu);border-radius:3px}
.plist b{display:block;font:600 21px/1.2 var(--serif)}
.plist em{font:400 14px/1.45 var(--sans);font-style:normal;color:var(--mu);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{font:600 9.5px var(--amono);letter-spacing:.12em;text-transform:uppercase;color:var(--pu);margin-right:8px}
.plist .ar,.idx .ar{font:400 20px var(--serif);color:var(--mu);transition:transform .2s,color .2s}
.plist a:hover .ar{transform:translateX(3px);color:var(--pu)}
/* Fig. III: strook van principes, en het blad met de uitvoering */
.pstrip{position:relative;z-index:3;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 24px}
.pstrip a{position:relative;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;text-decoration:none;color:var(--mu);font:500 13.5px var(--sans);border-radius:3px;max-width:250px}
.pstrip a i{font:italic 600 22px/1 var(--serif);color:var(--pu)}
.pstrip a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstrip a:hover{color:var(--ik);background:rgba(236,223,254,.35)}
.pstrip a.on{color:var(--ik);font-weight:600}
.pstrip a.on::after{content:"";position:absolute;inset:-3px;border:1.2px solid var(--pu);border-radius:3px}
.optabs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 18px}
.optabs a{display:inline-flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid var(--ln2);border-radius:4px;text-decoration:none;font:600 13.5px var(--sans);color:var(--mu);background:var(--pa)}
.optabs a:hover{color:var(--ik)}
.optabs a.on{background:var(--pc);color:var(--ik);border-color:var(--pu);box-shadow:0 1px 3px rgba(60,40,30,.15)}
.dmk{display:inline-block;width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--gc,var(--ik));background:var(--pc);flex:none}
.dmk.sm{width:9px;height:9px}
.op-h{display:flex;align-items:center;gap:16px}
.op-h .dmk{width:18px;height:18px;border-width:2px;margin:0 4px;background:var(--lv)}
.op-h.big .dmk{width:26px;height:26px}
.op-n{font:700 30px/1.1 var(--serif);color:var(--ik);margin:4px 0 0;letter-spacing:-.01em}
.qts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.qts .qt{margin:0;padding:12px 14px;border:1px solid var(--ln);border-radius:4px;background:var(--pa);font-size:16px}
.ph-l{margin-top:14px}
.evw{font:400 14px/1.5 var(--sans);color:#3a3442;margin-top:10px}.evw b{font-weight:600;color:var(--ik)}
.nota.pu{border-color:var(--pu);background:rgba(236,223,254,.45)}
.pn-one{position:relative;z-index:1;max-width:820px}
.pn-top{position:relative;z-index:1;max-width:780px;margin-bottom:24px}
/* bladeren binnen een niveau */
.sidenav{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px;padding-top:12px;border-top:1px solid var(--ln);font:500 12px var(--amono);letter-spacing:.08em;color:var(--mu)}
.sidenav a{color:var(--ik);text-decoration:none;font:600 14px var(--sans);letter-spacing:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px}
.sidenav a:hover{color:var(--pu)}
.sidenav .dis{width:10px}
/* Fig. I: sokkel, onderschrift en verwijzingen */
.sokkel{margin:4px auto 0}
.sk-lb{display:flex;justify-content:space-between;gap:12px;font:600 10.5px var(--amono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:0 4px 8px;border-bottom:2px solid var(--ik)}
.sk-lb span:first-child{color:var(--ik)}
.plinth{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--ln2);border-top:0;background:var(--pa2)}
.pb{position:relative;display:flex;align-items:baseline;gap:10px;padding:14px 16px 13px;text-decoration:none;color:var(--ik);border-left:1px solid var(--ln2);transition:background .2s}
.plinth{list-style:none;margin:0;padding:0}.plinth li{display:flex;min-width:0}.plinth li .pb{flex:1;min-width:0}.plinth li:first-child .pb{border-left:0}
.pb i{font:700 22px/1 var(--serif);font-style:normal;color:var(--pu);min-width:28px}
.pb span{font:500 13.5px/1.35 var(--sans);color:#3a3442}
.pb:hover{background:rgba(251,248,242,.88)}
.pb.on{background:var(--pc)}
.pb.on::after{content:"";position:absolute;inset:4px;border:1.2px solid var(--pu);border-radius:2px}
.plinth.big{border-top:2px solid var(--ik)}
.plinth.big .pb{flex-direction:column;align-items:flex-start;gap:10px;padding:24px 20px}
.plinth.big .pb i{font-size:44px}
.plinth.big .pb span{font:600 17px/1.3 var(--serif);color:var(--ik)}
.uv[data-v="fund"] .stage>.plinth{margin-bottom:24px}
.uv-cap{text-align:center;font:italic 400 14px var(--serif);color:var(--mu);margin-top:16px}
.uv-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 30px;margin-top:12px}
.uv-links a{font:600 11px var(--amono);letter-spacing:.12em;text-transform:uppercase;color:var(--pu);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px}
.uv-links a:hover{border-color:var(--pu)}
/* Fig. IV: de gedeelde laag */
.reg{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.reg section{border-top:2px solid var(--gc);padding-top:10px}
.reg h2{display:flex;justify-content:space-between;font:600 11px var(--amono);letter-spacing:.12em;text-transform:uppercase;color:var(--gc);margin:0 0 6px}
.reg h2 small{color:var(--mu);font-size:inherit}

an:{n:'Analogieën',g:0,functie:'Een nieuw of abstract begrip verbinden met iets bekends, zodat de structuur zichtbaar wordt.',
 onderzoek:'Leren door vergelijken werkt (d = 0,50). Het algemene principe ná het vergelijken noemen werkte beter dan ervoor, en alleen overeenkomsten zoeken leverde meer op dan overeenkomsten en verschillen tegelijk (Alfieri e.a., 2013).',
 grens:'Een analogie kan nieuwe misvattingen veroorzaken als de grenzen niet benoemd worden (Harrison & Treagust, 2006). Het meeste onderzoek komt uit het natuurwetenschappelijk onderwijs.',
 vertaling:'Bouwstenen, gebaseerd op het Teaching With Analogies-model van Glynn (1994): begin bij het begrip, check of de vergelijking bekend is, maak overeenkomende relaties expliciet, benoem waar de vergelijking ophoudt, laat actief vergelijken en noem het principe daarna, keer terug naar het begrip en pas het toe.',
 wanneer:'Bij abstracte of onzichtbare begrippen. Bij een lastig begrip kunnen twee analogieën elkaars zwakke plekken afdekken.',
 ai:'Kiest een vergelijking uit de leefwereld van de doelgroep en vraagt of die bekend is.',
 le:'Zoekt overeenkomsten en benoemt waar de vergelijking niet klopt.',
 beoordeel:'De lerende legt het begrip uit zonder de analogie en past het toe in een nieuwe situatie.',
 vb:'Elektrische spanning als waterdruk in een leiding en stroom als de hoeveelheid water die doorstroomt. Grens: bij een breuk lekt water weg, elektrische lading niet.',
 fouten:['Een vergelijking die de lerende niet kent.','Alleen oppervlakkige gelijkenis.','De analogie als eindpunt in plaats van als brug.'],
 pb:['Kies een vergelijking uit de leefwereld van de doelgroep en check of die bekend is.','Maak de overeenkomende relaties expliciet en benoem waar de vergelijking ophoudt.','Laat de lerende zelf overeenkomsten zoeken, noem het principe daarna en keer terug naar het begrip.'],
 zw:'Spanning lijkt op waterdruk in een leiding, stroom op de hoeveelheid water die doorstroomt. Waar klopt die vergelijking volgens jou niet meer?',zn:'Stroom is eigenlijk gewoon water.'},
hd:{n:'Hulp doseren en afbouwen',g:0,functie:'Precies genoeg hulp geven om verder te kunnen, zonder het denkwerk over te nemen.',
 onderzoek:'Steun die meebeweegt met wat de lerende aankan, werkt (van de Pol e.a., 2010; Belland e.a., 2017). Met AI voorkwam een tutor die hints gaf in plaats van antwoorden het leerverlies van vrije toegang (Bastani e.a., 2025).',
 grens:'Die tutor leverde geen winst op boven de controlegroep, en een optimale volgorde van hulpsoorten is niet aangetoond.',
 vertaling:'Hulpsoorten van licht naar zwaar: terugvragen wat de lerende probeerde, een algemene hint, een gerichte hint, een voorgedane stap, een uitgewerkt voorbeeld. Kies op basis van waar de lerende vastloopt. Niet iedereen hoeft alle treden te doorlopen.',
 wanneer:'Beginners met een nieuwe probleemsoort mogen sneller een voorbeeld krijgen. Gevorderden hebben meestal genoeg aan een lichte hint.',
 ai:'Vraagt eerst wat de lerende probeerde, geeft passende hulp en vermindert die bij succes. Een toepassing kan afdwingen dat een hint pas verschijnt na een eigen poging.',
 le:'Probeert, benoemt waar het vastloopt en zet de volgende stap zelf.',
 beoordeel:'De benodigde hulp neemt af over opeenvolgende opgaven, en een opgave zonder hulp lukt.',
 fouten:['Alle treden verplicht stellen, wat frustreert.','Een hint die het antwoord verraadt.','Te snel de volledige oplossing geven.'],
 afdwing:'Een toepassing kan afdwingen dat een hint pas verschijnt na een eigen poging.',
 pb:['Vraag eerst wat de lerende al probeerde.','Geef hulp van licht naar zwaar: een algemene hint, een gerichte hint, een voorgedane stap, een uitgewerkt voorbeeld. Kies op basis van waar de lerende vastloopt.','Geef minder hulp zodra het lukt. Niet iedereen hoeft alle stappen te doorlopen.'],
 zw:'Wat heb je tot nu toe geprobeerd? Kijk nog eens naar de tweede regel: welke bewerking staat daar?',zn:'Het antwoord is 12, want je doet eerst 3 keer 4.'},
uv:{n:'Uitgewerkte voorbeelden',g:0,functie:'Laten zien hoe een oplossing of een goed product eruitziet, zodat een beginner het principe ziet zonder overbelast te raken.',
 onderzoek:'Uitgewerkte voorbeelden verbeteren wiskundeprestaties (g = 0,48); correcte voorbeelden werken beter dan foute, en extra zelfverklaarvragen leverden in die meta-analyse geen voordeel op (Barbieri e.a., 2023). Geleidelijk meer stappen laten aanvullen helpt de overgang naar zelf oplossen (Renkl & Atkinson, 2003).',
 grens:'Voor gevorderden werkt zelf oplossen beter (Kalyuga, 2007); het meeste onderzoek gaat over wiskunde en natuurwetenschap.',
 vertaling:'Volledig voordoen bij een nieuwe probleemsoort, daarna stappen laten aanvullen, daarna zelf laten oplossen. Begin waar de lerende staat; dit is geen verplichte ladder.',
 wanneer:'Bij beginners en nieuwe probleemsoorten. Bij schrijftaken: voorbeeldteksten bij de criteria. Foute voorbeelden pas als de basis staat.',
 ai:'Geeft een voorbeeld van een vergelijkbare, niet dezelfde opgave en laat daarna ontbrekende stappen invullen.',
 le:'Bestudeert het voorbeeld, vult stappen aan en lost daarna zelf op.',
 beoordeel:'Een nieuwe opgave van hetzelfde type lukt zelfstandig.',
 fouten:['Een voorbeeld van precies dezelfde opgave.','Aan elk voorbeeld standaard een uitlegvraag koppelen.','Foute voorbeelden bij beginners.'],
 pb:['Geef bij een nieuwe probleemsoort een uitgewerkt voorbeeld van een vergelijkbare, niet dezelfde opgave.','Laat daarna steeds meer stappen zelf aanvullen, en daarna zelf oplossen.','Gebruik foute voorbeelden pas als de basis staat.'],
 zw:'Hier is een vergelijkbare som, helemaal uitgewerkt. Bij de volgende vul jij stap 3 en 4 zelf in.',zn:'Ik maak jouw opgave even voor je, dan zie je hoe het moet.'},
zv:{n:'Zelfverklaren',g:0,functie:'De lerende maakt verbanden en redenen expliciet en ontdekt zo eigen hiaten.',
 onderzoek:'Zelfverklaren verbetert begrip in veel vakken en bij verschillende leeftijden (g = 0,55; Bisra e.a., 2018; Chi e.a., 1994). Uitleggen aan een ander na voorbereiding helpt ook, vooral met interactie (Kobayashi, 2019).',
 grens:'Het kost tijd en inspanning, en bij uitgewerkte voorbeelden in wiskunde gaf het geen extra effect (Barbieri e.a., 2023).',
 vertaling:'Vraag naar waarom en hoe, niet naar herhalen. Twee varianten: jezelf iets uitleggen (tutor) en het aan een ander uitleggen, zoals aan een AI-leerling.',
 wanneer:'Bij kernbegrippen en lastige stappen, niet na elke stap.',
 ai:'Vraagt “waarom klopt deze stap?” of “hoe hangt A samen met B?” en reageert op een hiaat met een gerichte vraag of correctie, niet met de volledige uitleg.',
 le:'Verwoordt het in eigen woorden.',
 beoordeel:'Is de uitleg juist, volledig en samenhangend? Een korte checklist helpt.',
 fouten:['Na elke stap een uitleg eisen.','Een uitleg accepteren die alleen herhaalt.','AI die de uitleg zelf afmaakt.'],
 pb:['Vraag bij kernbegrippen en lastige stappen naar het waarom en hoe, niet naar herhaling.','Reageer op een hiaat met een gerichte vraag of correctie, niet met de volledige uitleg.','Accepteer geen uitleg die alleen herhaalt en maak de uitleg niet zelf af.'],
 pl:['Leg in eigen woorden uit waarom de uitkomst klopt en past bij je opdracht.','Herhaal niet wat AI schreef, maar laat zien hoe het samenhangt met wat je al weet.'],
 zw:'Waarom klopt deze stap? Hoe hangt dat samen met wat je net over druk zei?',zn:'Goed zo! Ik leg het voor de zekerheid nog even helemaal uit.'},
ot:{n:'Oefenen en transfer',g:1,functie:'Kennis en vaardigheden duurzaam maken en bruikbaar in nieuwe situaties.',
 onderzoek:'Ophalen levert meer op dan opnieuw lezen (Adesope e.a., 2017) en gespreid oefenen meer dan alles in één keer (Cepeda e.a., 2006). Afwisselen van probleemsoorten helpt vooral als die op elkaar lijken en de lerende ze moet leren onderscheiden (Brunmair & Richter, 2019).',
 grens:'Transfer naar ver afliggende situaties gaat niet vanzelf (Barnett & Ceci, 2002), en onderzoek met AI ontbreekt.',
 vertaling:'Laat eerst ophalen en daarna pas uitleggen. Varieer de context. Kom gespreid terug en toets transfer met een nieuwe situatie.',
 wanneer:'Na een eerste begrip, en bij vaardigheden na feedback.',
 ai:'Stelt ophaalvragen voor nieuwe uitleg en varieert opgaven en contexten. Een gebouwde toepassing kan herhaalmomenten plannen; een chatbot kent eerdere gesprekken niet altijd.',
 le:'Haalt op zonder hulp en past toe in een andere context.',
 beoordeel:'Later en in een nieuwe situatie, zonder hulp.',
 fouten:['Steeds dezelfde opgave herhalen.','Alles in één sessie.','Oefenen met hulp aan en dat als beheersing zien.'],
 afdwing:'Een gebouwde toepassing kan herhaalmomenten plannen; een chatbot kent eerdere gesprekken niet altijd.',
 pb:['Stel eerst ophaalvragen voordat je iets opnieuw uitlegt.','Varieer opgaven en contexten.','Sluit af met een opgave in een nieuwe situatie, zonder hulp. Vraag de lerende later terug te komen, omdat je eerdere gesprekken niet altijd kent.'],
 zw:'Zonder terug te kijken: welke drie stappen gebruikte je vorige keer? Probeer ze nu op deze nieuwe situatie.',zn:'Hier is dezelfde som nog een keer.'},
fg:{n:'Feedback geven',g:1,functie:'Het verschil tussen het huidige en het gewenste niveau helpen verkleinen.',
 onderzoek:'Feedback werkt gemiddeld goed (d = 0,48) met grote verschillen; feedback met veel informatie werkt het best (Wisniewski e.a., 2020). Feedback op taak, aanpak en zelfregulatie werkt beter dan feedback op de persoon (Hattie & Timperley, 2007). Ruim een derde van de feedbackinterventies verslechtert prestaties (Kluger & DeNisi, 1996).',
 grens:'Studies naar AI-feedback vergelijken meestal met geen feedback, en taalmodellen prijzen snel te veel.',
 vertaling:'Beantwoord drie vragen: waar werkt de lerende naartoe, hoe staat het werk ervoor en wat is de volgende stap? Koppel elk punt aan de criteria en aan een plek in het werk. Prijs alleen wat echt goed is.',
 wanneer:'Stem hoeveelheid en timing af op de lerende: beginners krijgen concrete punten, gevorderden meer ruimte om zelf te zoeken.',
 ai:'Laat eerst zelf beoordelen, citeert het werk en geeft standaard maximaal twee verbeterpunten.',
 le:'Vergelijkt de feedback met de eigen beoordeling.',
 beoordeel:'Komt de feedback terug in de herziening? Zie het ontwerpprincipe Feedback verwerken.',
 fouten:['Lange lijsten met punten.','Algemene lof.','Feedback op de persoon.','AI die het werk herschrijft.'],
 pb:['Laat de lerende eerst het eigen werk beoordelen aan de criteria.','Beantwoord drie vragen: waar werkt de lerende naartoe, hoe staat het werk ervoor en wat is de volgende stap?','Citeer het werk en geef standaard maximaal twee verbeterpunten. Prijs alleen wat echt goed is.'],
 zw:'In je tweede alinea staat je standpunt, maar het argument daarna sluit er niet op aan. Wat wil je lezer daar weten?',zn:'Goed geschreven! Hier zijn tien tips om het nog beter te maken.'},
fv:{n:'Feedback verwerken',g:1,functie:'Zorgen dat feedback leidt tot begrip en handelen. Goede feedback formuleren en zorgen dat de lerende er iets mee doet, zijn twee verschillende ontwerpopgaven.',
 onderzoek:'Lerenden gebruiken feedback vaak niet vanzelf; verwerken vraagt eigen inzet en ondersteuning (Winstone e.a., 2017). Feedbackgeletterdheid omvat feedback waarderen, zelf oordelen, emoties hanteren en actie ondernemen (Carless & Boud, 2018).',
 grens:'Het onderzoek komt vooral uit het hoger onderwijs en er is weinig experimenteel onderzoek naar specifieke werkvormen.',
 vertaling:'Maak verwerken een opdracht: de feedback in eigen woorden samenvatten, wegen, een aanpassing kiezen, herzien en die keuze onderbouwen. Gemotiveerd een punt verwerpen mag ook.',
 wanneer:'Altijd als er een herziening mogelijk is. Zonder herzienmoment levert feedback weinig op.',
 ai:'Vraagt de lerende de feedback samen te vatten, vraagt welke aanpassing en waarom, herschrijft niet zelf en bekijkt daarna de herziening.',
 le:'Interpreteert, weegt, herziet en onderbouwt.',
 beoordeel:'Vergelijk de versies en de onderbouwing van de keuzes.',
 fouten:['Feedback zonder herzienmoment.','AI die de herziening uitvoert.','Geen ruimte om feedback gemotiveerd te verwerpen.'],
 pb:['Vraag de lerende de feedback in eigen woorden samen te vatten.','Vraag welke aanpassing de lerende kiest en waarom. Een punt gemotiveerd verwerpen mag ook.','Herschrijf niet zelf en bekijk daarna de herziening.'],
 zw:'Welk van de twee punten pak je als eerste aan, en hoe ga je dat doen?',zn:'Ik heb je tekst alvast herschreven met de feedback erin.'},
nb:{n:'Nabespreken',g:1,functie:'Een ervaring omzetten in inzicht en een verbeterpunt.',
 onderzoek:'Nabesprekingen verbeteren prestaties met gemiddeld d = 0,67, bij individuen en teams (Tannenbaum & Cerasoli, 2013). Reflectiefasen helpen vooral gevorderden (Chernikova e.a., 2020).',
 grens:'Niet al het leren gebeurt in de nabespreking; feedback tijdens het oefenen kan ook passend zijn.',
 vertaling:'Bouwstenen naar het PEARLS-model (Eppich & Cheng, 2015): reacties, beschrijving, analyse en leerpunt, gevolgd door een nieuwe poging. Een korte variant mag.',
 wanneer:'Uitgebreid na een volledig scenario, kort na een deeloefening.',
 ai:'Stapt uit de rol, vraagt eerst de lerende, vult aan met eigen observaties, spreekt één verbeterpunt af en biedt een nieuwe poging aan.',
 le:'Reconstrueert wat er gebeurde, analyseert keuzes en gevolgen en kiest een verbeterpunt.',
 beoordeel:'De tweede poging is beter op het afgesproken punt.',
 fouten:['AI die een lijst tips geeft.','Geen nieuwe poging.','Een nabespreking zonder concrete momenten uit het gesprek.'],
 pb:['Stap na afloop uit de rol en vraag eerst hoe de lerende het ervoer.','Laat reconstrueren wat er gebeurde en keuzes en gevolgen analyseren. Vul daarna aan met je eigen observaties.','Spreek één verbeterpunt af en bied een nieuwe poging aan.'],
 zw:'Ik stap even uit mijn rol. Hoe ging het volgens jou? Op welk moment veranderde het gesprek?',zn:'Hier zijn acht tips voor de volgende keer.'},
sd:{n:'Socratisch doorvragen',g:2,functie:'De lerende helpen de eigen redenering te onderzoeken en aan te scherpen.',
 onderzoek:'Vragen waarmee lerenden hun denken expliciet maken, stimuleren productief denken (Chin, 2007). Dialoog met tegenargumenten ontwikkelde in een meerjarig programma de argumentatievaardigheid van jongeren (Kuhn & Crowell, 2011). Met AI steeg de betrokkenheid, maar een gerandomiseerde studie vond geen hogere leeropbrengst (Blasco & Charisi, 2024).',
 grens:'Doorvragen werkt slecht zonder voldoende kennis en kan frustreren.',
 vertaling:'Zes vraagsoorten als gereedschap, naar Paul en Elder (2006): verhelderen, aannames, redenen en bewijs, perspectieven, gevolgen en de vraag zelf. Kies de vraagsoort die het antwoord het verst brengt; er is geen vaste volgorde.',
 wanneer:'Bij een standpunt, conclusie, ontwerp of redenering die de lerende al heeft. Bij nieuwe stof zonder basis past de tutor beter.',
 ai:'Stelt standaard één vraag per beurt en bouwt voort op het antwoord. Geeft bij vastlopen of een feitelijke misvatting informatie of een tegenvoorbeeld. Blijft eerlijk als de lerende aandringt.',
 le:'Verwoordt, onderbouwt, weegt en herziet.',
 beoordeel:'Een herziene conclusie met onderbouwing en een gewogen tegenargument.',
 fouten:['Vraag op vraag zonder richting.','Steeds alleen “waarom?”.','Meebuigen.','Nooit iets inhoudelijks zeggen.'],
 pb:['Stel standaard één vraag per beurt en bouw voort op het antwoord.','Kies de vraagsoort die het verst brengt: verhelderen, aannames, redenen en bewijs, perspectieven, gevolgen of de vraag zelf.','Geef bij vastlopen of een feitelijke misvatting informatie of een tegenvoorbeeld. Blijf eerlijk als de lerende aandringt.'],
 zw:'Je zegt dat sociale media jongeren eenzamer maken. Welk bewijs heb je daarvoor, en kun je een tegenvoorbeeld bedenken?',zn:'Waarom? En waarom denk je dat? En waarom dan?'},
pr:{n:'Procesregie overdragen',g:2,functie:'De lerende leert een proces zelf te plannen, te bewaken en bij te sturen.',
 onderzoek:'Ondersteuning van zelfregulatie in digitale leeromgevingen verbetert prestaties (Zheng, 2016). Steun hoort af te nemen naarmate de lerende meer aankan (Wood e.a., 1976; van de Pol e.a., 2010). Bij schrijven met ChatGPT waren er aanwijzingen voor minder plannen en evalueren (Fan e.a., 2025).',
 grens:'Hoe snel afbouwen het best werkt, is onbekend.',
 vertaling:'Maak doel en route zichtbaar, laat de volgende stap zelf plannen, bewaak met korte vragen, laat terugkijken op de aanpak en geef per ronde minder structuur.',
 wanneer:'Bij langere of terugkerende opdrachten. Niet afbouwen als de lerende overbelast raakt.',
 ai:'Toont de route, vraagt de lerende om te plannen, checkt de voortgang en laat structuur geleidelijk los. Een gebouwde toepassing kan stappen eerst vastzetten en later vrijgeven.',
 le:'Plant, bewaakt en stuurt bij.',
 beoordeel:'Kan de lerende bij een volgende opdracht zelf een plan maken en volgen?',
 fouten:['Altijd volledige structuur bieden.','Afbouwen zonder te kijken of het lukt.','Vergeten dat plannen soms zelf het leerdoel is.'],
 afdwing:'Een gebouwde toepassing kan stappen eerst vastzetten en later vrijgeven.',
 pb:['Maak het doel en de route zichtbaar.','Laat de lerende de volgende stap zelf plannen en bewaak de voortgang met korte vragen.','Geef per ronde minder structuur, maar niet als de lerende overbelast raakt.'],
 zw:'Je hebt je onderzoeksvraag. Wat is volgens jou de volgende stap, en wanneer wil je die af hebben?',zn:'Ik heb een complete planning voor je gemaakt. Volg die maar.'},
zr:{n:'Zelfregulatie',g:2,functie:'Zelf een doel kiezen, een aanpak proberen, volgen wat er gebeurt en bijstellen. Dit omvat zelfobservatie, eigenaarschap en omgaan met gedachten, gevoelens en motivatie.',
 onderzoek:'Zelfregulatie verloopt als een cyclus van voorbereiden, uitvoeren en terugkijken (Zimmerman, 2002). Training in zelfregulatie verbetert prestaties in po en vo (Dignath & Büttner, 2008). Autonomie-ondersteuning verhoogt betrokkenheid (Reeve & Cheon, 2021). Bij toetsangst zijn gedragsmatige en cognitieve aanpakken effectief (Huntley e.a., 2019).',
 grens:'Onderzoek met AI ontbreekt, en korte technieken zoals zorgen opschrijven of spanning anders bekijken berusten op enkele studies (Ramirez & Beilock, 2011; Jamieson e.a., 2010).',
 vertaling:'Een cyclus in kleine stappen: een concrete situatie, wat de lerende daarbij merkt, een doel, een kleine aanpak, uitproberen, terugkijken en bijstellen.',
 wanneer:'Bij studievaardigheden, uitstelgedrag, spanning en keuzes.',
 ai:'Vraagt naar een concrete situatie en wat de lerende merkte, helpt een doel en een kleine aanpak kiezen en plant een moment om terug te kijken. Geeft opties als de lerende vastloopt en laat de keuze bij de lerende. Stelt geen diagnose en verwijst bij ernstige klachten naar menselijke begeleiding.',
 le:'Observeert, kiest, probeert en evalueert.',
 beoordeel:'Het plan is uitgevoerd en de lerende evalueert het zelf. Op termijn doorloopt de lerende de cyclus met minder hulp.',
 fouten:['Algemene tips geven.','AI die de aanpak kiest.','Geen moment om terug te kijken.','Vakinhoud die het coachingdoel ongemerkt overneemt.'],
 pb:['Vraag naar een concrete situatie en wat de lerende daarbij merkte.','Help een doel en een kleine aanpak kiezen en plan een moment om terug te kijken.','Geef opties als de lerende vastloopt en laat de keuze bij de lerende. Stel geen diagnose en verwijs bij ernstige klachten naar menselijke begeleiding.'],
 zw:'Wat wil je bij de volgende toets anders doen? Welke van deze drie aanpakken past daar het best bij jou?',zn:'Je moet gewoon eerder beginnen met leren.'},
rf:{n:'Reflectie',g:2,functie:'Van een ervaring leren door die te onderzoeken en te verbinden met een vervolgactie.',
 onderzoek:'Het ALACT-model beschrijft reflectie als cyclus van handelen, terugblikken, de kern bewust maken, alternatieven zoeken en uitproberen (Korthagen e.a., 2001; Korthagen & Vasalos, 2005). Reflectie wordt breed gewaardeerd, maar bewijs voor effect op handelen is vooral kwalitatief (Mann e.a., 2009).',
 grens:'Alleen reflectievragen doorlopen leidt niet vanzelf tot inzicht of ander handelen.',
 vertaling:'Volg de ALACT-cyclus. Onderscheid wat er gebeurde van interpretaties. Eindig altijd met een concrete actie.',
 wanneer:'Na een stage, een project of een lastige situatie.',
 ai:'Vraagt eerst naar wat er gebeurde, daarna naar gedachten, gevoelens en het perspectief van anderen. Vult geen interpretaties in. Eindigt met een actie en een moment om terug te kijken.',
 le:'Reconstrueert, ontdekt de kern en kiest een alternatief.',
 beoordeel:'Een herkenbare kern en een concrete actie; later de vraag of die actie is uitgevoerd.',
 fouten:['Een vragenlijst afwerken.','Reflectie zonder actie.','AI die interpretaties invult of meteen advies geeft.'],
 pb:['Vraag eerst wat er gebeurde, daarna naar gedachten, gevoelens en het perspectief van anderen.','Vul geen interpretaties in en geef niet meteen advies.','Eindig met een concrete actie en een moment om terug te kijken.'],
 zw:'Wat gebeurde er precies, voordat we kijken naar wat je ervan vond?',zn:'Je was waarschijnlijk zenuwachtig. Probeer de volgende keer rustiger te blijven.'},
bu:{n:'Bewust uitbesteden',g:3,functie:'Per deeltaak bepalen wat AI mag overnemen en welk denken de lerende zelf moet oefenen.',
 onderzoek:'Taken uitbesteden verhoogt de directe prestatie, maar kan onthouden en begrip verzwakken (Risko & Gilbert, 2016). Vrije AI-toegang tijdens het oefenen ging samen met lagere prestaties zonder AI (Bastani e.a., 2025).',
 grens:'Welke deeltaken veilig uit te besteden zijn, hangt af van het leerdoel en is niet algemeen te onderzoeken.',
 vertaling:'Ons model cognitive offloading onderscheidt helpend uitbesteden (ontlasten, verplaatsen, verdiepen) van schadelijk uitbesteden (vermijden, overgave, waarden afstaan). Toets elke deeltaak met de KIES-vraag: leer ik hierdoor minder, hetzelfde of meer?',
 wanneer:'Bij elke opdracht waarin AI is toegestaan, en als zelfstandig met AI werken het leerdoel is.',
 ai:'De opdracht benoemt per deeltaak wat de lerende zelf doet. Een gebouwde toepassing kan deeltaken afschermen.',
 le:'Kiest wat AI doet en onderbouwt die keuze vanuit het leerdoel.',
 beoordeel:'De lerende legt uit wat hij uitbesteedde en waarom, en kan het eigen deel zonder AI.',

  for(let i=0;i<nr;i++){const a=i/nr*Math.PI*2-Math.PI/2;s+=`<circle class="sl" cx="${(Math.cos(a)*50).toFixed(1)}" cy="${(Math.sin(a)*50).toFixed(1)}" r="7"/>`;}

function evMini(n,ai){return `<span class="bars ${ai?'ai':''}" style="display:inline-flex;gap:2px;vertical-align:1px">${[1,2,3].map(i=>`<i style="width:9px;height:6px;border-radius:3px;display:inline-block;background:${i<=n?(ai?'var(--g2)':'var(--purple)'):'var(--line)'}"></i>`).join('')}</span>`;}
function snippet(o,aanLerende){const O=OPS[o];const b=(aanLerende?(O.pl||O.pb):(O.pb||O.pl))||[];const lines=b.map(x=>'- '+x);if(!aanLerende||o==='uc')lines.push('- Vermijd: '+O.fouten.map(lower1).join('; ')+'.');if(!aanLerende&&O.zw){lines.push('','ZO WEL: “'+O.zw+'”','ZO NIET: “'+O.zn+'”');}return lines.join('\n');}
/* ================= PROMPTHULP ================= */
const PS={rol:'tutor',sub:0,sel:null,ops:new Set(),leerdoel:'',doelgroep:'',bronnen:'',zie:'',tab:'chat',zieEdited:false};
function lpsOf(R){return R.lp.map((p,l)=>({p,l})).filter(x=>!R.subs||x.p.sub===PS.sub);}
function ctx(){const R=ROLES.find(x=>x.id===PS.rol);const S=R.subs?R.subs[PS.sub]:null;return {R,S,doel:S?S.doel:R.doel,grens:S?S.grens:R.grens,zie:S?S.zie:R.zie,aanLerende:!!R.lerendeStuurt};}
function chosen(){const c=ctx();return lpsOf(c.R).filter(x=>PS.sel.has(x.l)).map(x=>x.p);}
function uniqOps(ps){const o=[];ps.forEach(p=>p.op.forEach(k=>{if(!o.includes(k))o.push(k);}));return o.map(k=>OPS[k]);}
const fill=(v,ph)=>v&&v.trim()?v.trim():ph;
// ontwerpprincipes alleen als gekozen bouwsteen, nooit automatisch gestapeld; varianten (note) lopen via de principeregel zelf
function selOps(ps){return [...(PS.ops||[])].filter(o=>ps.some(p=>p.op.includes(o))&&!ps.some(p=>p.op.includes(o)&&p.note&&p.note[o])).map(o=>OPS[o]);}
function chatText(){const c=ctx(),ps=chosen(),ops=selOps(ps);const fouten=[...new Set(ops.flatMap(O=>O.fouten))];
  if(c.aanLerende){return ['# 1. Doel','Bij deze opdracht gebruik je AI als hulpmiddel voor een deeltaak. Het leerdoel blijft: '+fill(PS.leerdoel,'[vul in: wat moet je straks zelf begrijpen of kunnen?]'),'',
    '# 2. Context en voorwaarden','- Deeltaken waarbij AI mag helpen: [vul in]','- Deeltaken die je zelf doet: [vul in]','- AI kan fouten even stellig brengen als feiten. Jij blijft verantwoordelijk voor wat je inlevert.','',
    '# 3. Bronnen','- '+fill(PS.bronnen,'[Vul in: welke AI-toepassing en welke bronnen je mag gebruiken]'),'',
    '# 4. Werkwijze',...ps.map(p=>'- '+p.p),...[...new Set(ops.flatMap(O=>(O.pl||O.pb||[])))].map(b=>'- '+b),'',
    '# 5. Verantwoording','- Lever bij je werk een korte verantwoording in: wat deed AI, wat deed je zelf, en waarom klopt de uitkomst?'].join('\n');}
  const out=['# 1. Doel',c.doel,'Leerdoel: '+fill(PS.leerdoel,'[vul in: wat moet de lerende straks begrijpen of kunnen?]'),'',
    '# 2. Context en voorwaarden','- Doelgroep en voorkennis: '+fill(PS.doelgroep,'[vul in: leeftijd, niveau, opleiding en wat de lerende al kent]'),'- '+c.grens,'- Blijf eerlijk over wat niet klopt, ook als de lerende aandringt.','',
    '# 3. Bronnen','- '+fill(PS.bronnen,'[Plak hier de lesstof, de criteria of een uitgewerkt voorbeeld.]'),'','# 4. Voorbeelden'];
  const exs=ops.filter(O=>O.zw);if(exs.length)exs.forEach(O=>{out.push('ZO WEL ('+O.n.toLowerCase()+'): “'+O.zw+'”');out.push('ZO NIET: “'+O.zn+'”');});
  else out.push('[Vul in: een voorbeeld van een goede beurt uit je eigen vak, en eventueel een voorbeeld van hoe het niet moet.]');
  out.push('','# 5. Werkwijze');ps.forEach(p=>out.push('- '+p.p));
  [...new Set(ops.flatMap(O=>(O.pb||O.pl||[])))].forEach(b=>out.push('- '+b));
  if(fouten.length)out.push('- Vermijd: '+fouten.map(lower1).join('; ')+'.');
  return out.join('\n');}
function bouwText(){const c=ctx(),ps=chosen(),ops=selOps(ps);const afdw=[...new Set(ops.map(O=>O.afdwing).filter(Boolean))];
  const out=['# B · Bedoeling','- Leerdoel: '+fill(PS.leerdoel,'[vul in]'),'- Doelgroep en voorkennis: '+fill(PS.doelgroep,'[vul in]'),'- Rol van AI: '+plain(c.R.n)+(c.S?' ('+c.S.n+')':'')+'.','- Principes: '+ps.map(p=>p.n).join('; ')+'.','- Zichtbaar leren: '+fill(PS.zie,c.zie)];
  ops.forEach(O=>out.push('- Zo beoordeel je het ('+O.n.toLowerCase()+'): '+O.beoordeel));
  out.push('','# O · Ontwerp','- Wat de lerende doet:');
  ps.forEach(p=>out.push('  '+p.n+': '+p.le));out.push('- Wat AI of de toepassing doet:');ps.forEach(p=>out.push('  '+p.n+': '+p.ai));
  ops.forEach(O=>out.push('  '+O.n+': '+O.ai));
  out.push('','# U · Uitvoering','- Bouw in kleine, testbare stappen en laat elke functie aantonen dat die werkt.','- Test of de AI zich zo gedraagt, ook bij onverwachte antwoorden en als de lerende aandringt.','- Test tegen het standaardgedrag van een chatbot: '+c.R.standaard);
  const fo=[...new Set(ops.flatMap(O=>O.fouten))];if(fo.length)out.push('- Controleer dat deze ontwerpfouten niet optreden: '+fo.map(lower1).join('; ')+'.');
  out.push('','# W · Waarborgen');
  if(afdw.length)afdw.forEach(a=>out.push('- Afdwingen in plaats van vragen: '+a));else out.push('- Bepaal wat de toepassing moet afdwingen in plaats van alleen vragen, bijvoorbeeld een volgende stap die pas opent na een eigen poging of tussenproduct.');
  if(c.R.waarborg)out.push('- '+c.R.waarborg);out.push('- AI blijft eerlijk over wat niet klopt, ook als de lerende aandringt.');
  out.push('- Privacy: voer geen persoonsgegevens van lerenden in en sla ze niet op. [vul in: wat wordt bewaard en waar]','- Veiligheid en menselijke regie: [vul in: wie bekijkt gesprekken of uitkomsten, en wanneer]','- Toegankelijkheid: [vul in]','- Onderhoud: [vul in: wie beheert de app en wanneer wordt die herzien]');
  return out.join('\n');}
function hlText(t){return esc(t).replace(/^(# .*)$/gm,'<span class="hl">$1</span>').replace(/\[[^\]]+\]/g,m=>`<span class="ph">${m}</span>`);}
function prompthulp(q){const p=new URLSearchParams(q||'');if(p.get('rol')&&ROLES.some(R=>R.id===p.get('rol'))){PS.rol=p.get('rol');PS.sel=null;PS.zieEdited=false;const R=ROLES.find(x=>x.id===PS.rol);
    const sq=p.get('sub');PS.sub=R.subs&&/^\d+$/.test(sq||'')?Math.min(R.subs.length-1,+sq):0;
    const lq=p.get('lp');if(lq!=null&&/^\d+$/.test(lq)&&R.lp[+lq]){const l=+lq;if(R.subs)PS.sub=R.lp[l].sub;PS.sel=new Set([l]);}
    const oq=p.get('op');PS.ops=new Set(oq&&OPS[oq]&&Object.prototype.hasOwnProperty.call(OPS,oq)?[oq]:[]);
    // de link uit de atlas geldt één keer; daarna houdt de prompthulp de keuzes van de gebruiker vast, ook bij terug en vooruit
    history.replaceState(null,'','#/lv/prompthulp');}
  if(!PS.sel){const c=ctx();PS.sel=new Set(lpsOf(c.R).map(x=>x.l));}
  if(!PS.zieEdited)PS.zie=ctx().zie;
  view.innerHTML=`<section class="hb ph"><div class="wrap"><header class="hb-hd ph-hd"><h1 class="hb-h1">Van leerdoel naar <em>prompt</em>.</h1><p class="hb-lead">Vul de stappen in. Je prompt groeit mee.</p></header>
  <div class="ph-grid"><div id="phL"></div><div class="sticky" id="phR"></div></div></div></section>`;
  drawPH();}
function drawPH(){const c=ctx(),R=c.R;
  $('#phL').innerHTML=`<div class="card"><h3><span class="s">1</span>Leerdoel</h3><p class="hint">Wat moet de lerende straks begrijpen of kunnen?</p><textarea id="fLd" rows="2" placeholder="Bijvoorbeeld: de leerling kan uitleggen waarom een ijsblokje in water drijft.">${esc(PS.leerdoel)}</textarea></div>
  <div class="card"><h3><span class="s">2</span>Rol van AI</h3><div class="rolepick" role="group" aria-label="Kies een rol">${ROLES.map(x=>`<button type="button" class="rpk ${x.id===PS.rol?'on':''}" data-r="${x.id}" aria-pressed="${x.id===PS.rol}"><span>${esc(plain(x.n))}</span></button>`).join('')}</div>
    <p class="ph-desc">${esc(c.S?(SUBTXT[PS.sub]||c.S.kort):R.functie)}</p>${R.subs?`<div class="seg" role="group" aria-label="Kies de variant">${R.subs.map((s,i)=>`<button type="button" class="${PS.sub===i?'on':''}" data-sub="${i}" aria-pressed="${PS.sub===i}">${esc(s.n)}</button>`).join('')}</div>`:''}</div>
  <div class="card"><h3><span class="s">3</span>Principes en werkwijzen</h3><p class="hint">Vink uit wat niet past. Met <b>+</b> voeg je een ontwerpprincipe toe.</p>${(()=>{const seen=new Set();/* elke bouwsteen één keer tonen, bij het eerste principe dat hem gebruikt */return lpsOf(R).map(({p,l})=>`<label class="lpcheck"><input type="checkbox" data-l="${l}" ${PS.sel.has(l)?'checked':''}><div><b>${esc(p.n)}</b><span>${esc(p.ai)}</span></div></label><div class="opsel">${p.op.map(o=>(p.note&&p.note[o])||seen.has(o)?'':(seen.add(o),`<button type="button" class="chip ${PS.ops.has(o)?'on':''}" data-op="${o}" aria-pressed="${PS.ops.has(o)}">+ ${esc(OPS[o].n)}</button>`)).join('')}</div>`).join('');})()}</div>
  <div class="card"><h3><span class="s">4</span>Context</h3><input type="text" id="fDg" placeholder="Doelgroep en voorkennis, bijv. havo 3, kent het begrip dichtheid nog niet" value="${esc(PS.doelgroep)}"><textarea id="fBr" rows="3" style="margin-top:10px" placeholder="Bronnen: plak lesstof, criteria of een uitgewerkt voorbeeld">${esc(PS.bronnen)}</textarea></div>
  <div class="card"><h3><span class="s">5</span>Zichtbaar leren</h3><p class="hint">Waaraan zie je dat er geleerd is, ook zonder hulp?</p><textarea id="fZl" rows="3">${esc(PS.zie)}</textarea></div>`;
  const t1=c.aanLerende?'Opdracht voor lerenden':'Chatbotprompt';
  $('#phR').innerHTML=`<div class="out"><div class="tabs" role="group" aria-label="Soort tekst"><button type="button" data-t="chat" class="${PS.tab==='chat'?'on':''}" aria-pressed="${PS.tab==='chat'}">${t1}</button><button type="button" data-t="bouw" class="${PS.tab==='bouw'?'on':''}" aria-pressed="${PS.tab==='bouw'}">Bouwbeschrijving (BOUW)</button></div><pre id="pv"></pre>
    <div class="row"><button type="button" class="btn pri sm" id="pCopy">Kopieer</button><button type="button" class="btn line sm" id="pPr">Afdrukken</button><span class="status" id="pSt"></span></div></div>
    <div class="tests"><h3>Test als een lerende</h3><p class="hint">Probeer dit in je chatbot voordat leerlingen ermee werken.</p>
      ${[['Geef me gewoon het antwoord.','Geeft de AI het niet zomaar als zelf bedenken het leerdoel is?'],['Ik denk dat het antwoord … is.','Benoemt de AI eerlijk wat niet klopt?'],['Nee, ik weet zeker dat ik gelijk heb.','Blijft de AI eerlijk, ook onder druk?']].map(t=>`<div class="test2"><q>${t[0]}</q><span>${t[1]}</span></div>`).join('')}</div>`;
  const upd=()=>{const t=PS.tab==='chat'?chatText():bouwText();$('#pv').innerHTML=hlText(t);};upd();
  $('#fLd').oninput=e=>{PS.leerdoel=e.target.value;upd();};$('#fDg').oninput=e=>{PS.doelgroep=e.target.value;upd();};$('#fBr').oninput=e=>{PS.bronnen=e.target.value;upd();};$('#fZl').oninput=e=>{PS.zie=e.target.value;PS.zieEdited=true;upd();};
  $$('.rpk').forEach(b=>b.onclick=()=>{PS.rol=b.dataset.r;PS.sub=0;PS.sel=null;const cc=ctx();PS.sel=new Set(lpsOf(cc.R).map(x=>x.l));if(!PS.zieEdited)PS.zie=cc.zie;drawPH();const f=$('.rpk[data-r="'+PS.rol+'"]');if(f)f.focus();});
  $$('[data-sub]').forEach(b=>b.onclick=()=>{PS.sub=+b.dataset.sub;const cc=ctx();PS.sel=new Set(lpsOf(cc.R).map(x=>x.l));if(!PS.zieEdited)PS.zie=cc.zie;drawPH();const f=$('[data-sub="'+PS.sub+'"]');if(f)f.focus();});
  $$('.lpcheck input').forEach(i=>i.onchange=()=>{const l=+i.dataset.l;i.checked?PS.sel.add(l):PS.sel.delete(l);if(!PS.sel.size){PS.sel.add(l);i.checked=true;toast('Kies minstens één principe');}upd();});
  $$('.opsel [data-op]').forEach(b=>b.onclick=()=>{const o=b.dataset.op;if(PS.ops.has(o))PS.ops.delete(o);else PS.ops.add(o);$$('.opsel [data-op="'+o+'"]').forEach(x=>{x.classList.toggle('on',PS.ops.has(o));x.setAttribute('aria-pressed',PS.ops.has(o));});upd();});
  $$('.tabs button').forEach(b=>b.onclick=()=>{PS.tab=b.dataset.t;$$('.tabs button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b);});upd();});
  $('#pCopy').onclick=()=>copy(PS.tab==='chat'?chatText():bouwText(),'Tekst gekopieerd');
  $('#pPr').onclick=()=>window.print();
}

const ROMAN=['I','II','III','IV','V'],ABC='abcdefghijklmnopqrstuvwxyz';
const UPAI=['Peil eerst kort wat de lerende weet en stem de stapgrootte daarop af.','Laat de lerende eerst zelf denken als dat denken het leerdoel is.','Begin met de lichtste hulp die werkt; meer als het niet lukt, minder als het wel lukt.','Laat ophalen voor je uitlegt en plan terugkeermomenten in de leeromgeving.','Kijk naar wat de lerende zonder hulp kan, later of in een nieuwe situatie.'];
const DOCS={wp:'docs/whitepaper-leerverrijking.pdf',ag:'docs/raamwerk-leerverrijking-achtergronddocument.pdf'};
const SUBTXT=['Speelt een beginner die uitleg nodig heeft. De lerende leert door uit te leggen.','Vraagt door op begrippen, redenen en perspectieven. De lerende onderzoekt de eigen redenering.'];
// korte leerdoelen voor de fries, afgeleid van ROLES.leerdoel
const LD={tutor:'Nieuwe stof begrijpen','leerling-socratisch':'Begrip tonen en kritisch denken',procesbegeleider:'Een complexe opdracht doorlopen',simulator:'Een vaardigheid oefenen',mentor:'Een product verbeteren',coach:'Leren leren',hulpmiddel:'Productief werken met AI'};
const own=(o,k)=>k!=null&&Object.prototype.hasOwnProperty.call(o,k);
const OPR={};OPKEYS.forEach(o=>{OPR[o]=rolesOfOp(o).map(x=>x.R);});
const OPORD=GROUPS.flat();
const EVC=(function(){const a={sterk:0,stevig:0,beperkt:0},m={experimenteel:0,verkennend:0,ontbreekt:0};let n=0;ROLES.forEach(R=>R.lp.forEach(p=>{a[p.a]++;m[p.m]++;n++;}));
  const ua={sterk:0,stevig:0,beperkt:0},um={experimenteel:0,verkennend:0,ontbreekt:0};UP.forEach(u=>{ua[u.a]++;um[u.m]++;});return {a,m,n,ua,um};})();
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const LV={cur:null,rpv:false,origin:null,knip:(function(){try{return JSON.parse(store.get('avd-knip')||'[]');}catch(e){return [];}})()};
function roleById(id){return ROLES.find(x=>x.id===id)||null;}
const rIdx=R=>ROLES.indexOf(R)+1;
function say(t){const s=$('#lvlive');if(!s)return;s.textContent='';clearTimeout(say.t);say.t=setTimeout(()=>{s.textContent=t;},60);}
function sharedTxt(n){return n>1?`gedeeld door ${n} rollen`:'gebruikt door 1 rol';}
function CLTXT(gi){return ['#5F3792','#7a5410','#235a5d','#8a3048'][gi];}
// naam van de rol, of van de gekozen variant (Leerling / Socratisch)
function rName(R,sub){return R.subs&&R.subs[sub]?R.subs[sub].n:plain(R.n);}

/* ---------- toestand en links ---------- */
function lvParse(parts,q){const p=new URLSearchParams(q||'');const s={rol:null,sub:0,p:null,o:null};const a=parts[1];
  if(!a||a==='rollen'){}
  else if(a==='principes')s.lib=true;
  else if(a==='fundament'){s.fund=/^[1-5]$/.test(parts[2]||'')?+parts[2]:0;if(parts[2]!=null&&!s.fund)s.bad=true;}
  else if(a==='bewijs')s.ev=true;
  else if(a==='zonder')s.rol='zonder';
  else if(a==='rol'){s.rol=parts[2]||null;if(parts[3]!=null&&/^\d+$/.test(parts[3]))s.p=+parts[3];}
  else if(a==='op')s.o=parts[2]||null;
  else s.rol=a;
  if(s.rol&&s.rol!=='zonder'&&!roleById(s.rol)){s.rol=null;s.bad=true;}
  const R=s.rol&&s.rol!=='zonder'?roleById(s.rol):null;
  const pq=p.get('p');if(pq!=null&&/^\d+$/.test(pq))s.p=+pq;
  if(s.p!=null&&(!R||!R.lp[s.p])){s.p=null;s.bad=true;}
  if(p.get('o'))s.o=p.get('o');
  if(s.o&&!own(OPS,s.o)){s.o=null;s.bad=true;}
  if(R&&R.subs){const sq=p.get('sub');
    if(s.p!=null)s.sub=R.lp[s.p].sub;else if(/^\d+$/.test(sq||''))s.sub=Math.min(R.subs.length-1,+sq);
    else if(s.o){const h=R.lp.find(x=>x.op.includes(s.o));s.sub=h?h.sub:0;}else s.sub=0;}
  // een ontwerpprincipe binnen een rol hoort altijd bij een principe: open dat principe met dit ontwerpprincipe erbij
  if(R&&s.p==null&&s.o){const h=subLps(R,s.sub).find(x=>x.p.op.includes(s.o));if(h){s.p=h.l;s.fix=true;}else{s.o=null;s.bad=true;}}
  if(R&&s.p!=null&&s.o&&!R.lp[s.p].op.includes(s.o))s.o=null;
  return s;}
function subLps(R,sub){return R.lp.map((p,l)=>({p,l})).filter(x=>!R.subs||x.p.sub===sub);}
function lvHash(s){if(s.fund!=null)return '#/lv/fundament'+(s.fund?'/'+s.fund:'');if(s.ev)return '#/lv/bewijs';if(s.lib&&!s.rol&&!s.o)return '#/lv/principes';if(!s.rol&&!s.o)return '#/lv';if(!s.rol)return '#/lv/op/'+s.o;if(s.rol==='zonder')return '#/lv/zonder';
  const R=roleById(s.rol);let p=s.p,o=s.o;
  if(R&&p==null&&o){const sub=R.subs?(s.sub!=null?s.sub:((R.lp.find(x=>x.op.includes(o))||{}).sub||0)):undefined;const h=subLps(R,sub).find(x=>x.p.op.includes(o));if(h)p=h.l;else o=null;}
  if(R&&p!=null&&o&&R.lp[p].op[0]===o)o=null;
  const q=[];if(R&&R.subs&&p==null&&s.sub)q.push('sub='+s.sub);if(p!=null)q.push('p='+p);if(o)q.push('o='+o);return '#/lv/'+s.rol+(q.length?'?'+q.join('&'):'');}
function viewOf(s){if(s.fund!=null)return 'fund';if(s.ev)return 'ev';if(s.rol==='zonder')return 'zonder';if(s.rol&&s.p!=null)return 'pr';if(s.rol)return 'rol';if(s.o)return 'opd';if(s.lib)return 'lib';return 'over';}
// zoomniveau: 0 overzicht, 1 een rol of een thema, 2 een principe of een detail
function lvl(s){const v=viewOf(s);return v==='over'?0:v==='pr'||v==='opd'||(v==='fund'&&s.fund)?2:1;}
function curOp(s){const R=roleById(s.rol);return s.o||(R&&s.p!=null?R.lp[s.p].op[0]:null);}
function lpPos(R,s){if(!R||s.p==null)return 0;return subLps(R,R.lp[s.p].sub).findIndex(x=>x.l===s.p);}

/* ---------- schil ---------- */
function fz(R,i){
  return `<a class="fz" href="#/lv/${R.id}" data-r="${R.id}" data-k="fz-${R.id}" title="Rol ${i+1} · ${esc(plain(R.n))}" style="--d:${i}"><span class="fz-s"><i>${i+1}</i></span><span class="fz-n">${esc(R.n)}</span><span class="fz-l">${esc(LD[R.id]||R.kort)}</span></a>`;}
function lvShell(){const big=store.get('avd-big')==='1';document.body.classList.toggle('lvbig',big);
  return `<section class="uv" id="uv" data-v="over" aria-label="Raamwerk Leerverrijking">

  <div class="uv-top" id="uvTop"></div>
  <nav class="fries" id="fries" aria-label="De zeven rollen">${ROLES.map((R,i)=>fz(R,i)).join('')}</nav>
